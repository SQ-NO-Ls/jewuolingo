// ── RENDERING THE LIVE CONVERSATION ───────────────────────────
function sichaBubble(m,i){
  var side=(m.who==='a')?'side-a':'side-b';
  var he=(m.who==='a')?sichaMarkUnknown(m.he):esc(m.he);
  var en=m.en?'<button class="sch-gloss-btn" onclick="sichaToggleEn('+i+')"><svg class="i"><use href="#i-eye"/></svg> translation</button>'+
              '<div class="sch-en" id="schEn'+i+'">'+esc(m.en)+'</div>':'';
  return '<div class="conv-bubble '+side+'">'+
    '<div class="spkr">'+(m.who==='a'?'בן/בת שיח':'את/ה')+'</div>'+
    '<span class="heb">'+he+'</span>'+en+
  '</div>';
}
function sichaToggleEn(i){ var el=document.getElementById('schEn'+i); if(el) el.classList.toggle('show'); }

// Deterministic post-check: the model WILL drift outside the slice — prompting
// is best-effort. This turns that failure into a feature by making the stray
// word learnable instead of confusing.
function sichaMarkUnknown(he){
  var out='', buf='';
  function flushWord(){
    if(!buf) return;
    if(isKnownToken(buf)) out+=esc(buf);
    else out+='<span class="sch-unk" onclick="sichaGloss(\''+encodeURIComponent(buf)+'\')">'+esc(buf)+'</span>';
    buf='';
  }
  for(var i=0;i<he.length;i++){
    var ch=he.charAt(i);
    if(/[א-ת֑-ׇ]/.test(ch)) buf+=ch;
    else { flushWord(); out+=esc(ch); }
  }
  flushWord();
  return out;
}
function sichaGloss(encoded){
  var w=decodeURIComponent(encoded), g=SCH.glosses[stripV(w)];
  if(g) toast(w+' = '+g.en+' ('+g.pron+')','good');
  else toast(w+' — outside your vocabulary; you will get it in the debrief','bad');
}

function sichaRender(){
  var sc=SCH.scen, qc=document.getElementById('quizContent');
  var crit=sc.successCriteria.map(function(c){
    var done=SCH.progress.indexOf(c)>-1;
    return '<div class="sch-check-row'+(done?' done':'')+'"><span class="sch-check-box">'+(done?'<svg class="i" style="width:12px;height:12px"><use href="#i-check"/></svg>':'')+'</span><span>'+esc(c)+'</span></div>';
  }).join('');
  var bubbles=SCH.thread.map(sichaBubble).join('');
  var html=
    '<div class="sch-turnbar"><span><span class="he-text">'+sc.he+'</span> · '+sc.en+'</span>'+
      '<span>תור '+SCH.turns+'/'+sc.maxTurns+' · support '+SCH.support+'</span></div>'+
    '<div class="sch-head">'+
      '<div class="sch-task"><div class="sch-task-lbl">המשימה</div><div class="sch-task-title">'+esc(sc.task)+'</div></div>'+
      '<div class="sch-check"><div class="sch-task-lbl">To finish</div>'+crit+'</div>'+
    '</div>'+
    '<div class="conv-thread" id="schThread">'+bubbles+
      (SCH.busy?'<div class="sch-typing"><i></i><i></i><i></i></div>':'')+
    '</div>';

  if(SCH.err){
    var m=sichaErrMsg(SCH.err);
    html+='<div class="sch-err"><span class="sch-err-he he-text">'+esc(m.he)+'</span><span class="sch-err-en">'+esc(m.en)+'</span></div>'+
      '<div class="quiz-actions" style="margin-top:10px">'+
        '<button class="btn" onclick="sichaRetry()">↻ Retry turn</button>'+
        '<button class="btn-ghost" onclick="setMode(\'conversation\')">Scripted conversations </button>'+
      '</div>';
  } else if(SCH.ended){
    html+='<div class="conv-result good" style="margin-top:12px">השיחה נגמרה — conversation complete</div>'+
      '<div class="quiz-actions" style="margin-top:12px">'+
        '<button class="btn" onclick="sichaRunDebrief()">See your debrief </button>'+
      '</div>';
  } else if(!SCH.busy){
    html+=sichaInputUI();
  }
  qc.innerHTML=html;
  var th=document.getElementById('schThread'); if(th) th.scrollTop=99999;
  var inp=document.getElementById('ti'); if(inp&&SCH.support!=='A') inp.focus();
}

function sichaInputUI(){
  var html='';
  if(SCH.support==='A'){
    var sug=SCH.suggestions||[];
    if(sug.length){
      html+='<div class="sch-sug">'+sug.map(function(s){
        return '<div class="sicha-sug conv-opt" onclick="sichaSend('+JSON.stringify(s).replace(/"/g,'&quot;')+')">'+
          '<span class="sg-he he-text">'+esc(s)+'</span></div>';
      }).join('')+'</div>';
      html+='<div class="set-help">Tap a reply, or press 1–3.</div>';
    } else {
      html+='<div class="set-help">No suggestions came back for this turn — type your reply below.</div>'+sichaTypeUI();
    }
    return html;
  }
  if(SCH.support==='B'){
    var used={};
    SCH.thread.forEach(function(m){ if(m.who==='b') stripV(m.he).split(/\s+/).forEach(function(t){used[t]=1;}); });
    var bank=SCH.slice.filter(function(w){ return !used[stripV(w.he)] && w.he.indexOf(' ')===-1; }).slice(0,8);
    html+='<div class="sch-sec-lbl">Word bank</div><div class="sch-bank">'+
      bank.map(function(w){ return '<span class="sch-bank-w" title="'+esc(w.en)+'" onclick="kbType('+JSON.stringify(w.he+' ').replace(/"/g,'&quot;')+')">'+esc(w.he)+'</span>'; }).join('')+
    '</div>';
    if(SCH.starter) html+='<div class="sch-starter he-text">התחלה: '+esc(SCH.starter)+' …</div>';
  }
  return html+sichaTypeUI();
}
function sichaTypeUI(){
  return '<div class="sch-input-row">'+
      '<input class="sch-input he-text" id="ti" placeholder="כתוב/כתבי בעברית…" inputmode="none" onkeydown="if(event.key===\'Enter\'){event.preventDefault();sichaSendInput();}">'+
      '<button class="btn" style="padding:12px 18px" onclick="sichaSendInput()">שלח</button>'+
    '</div>'+ buildKbd();
}
function sichaSendInput(){
  var i=document.getElementById('ti'); if(!i) return;
  var v=i.value.trim(); if(!v) return;
  sichaSend(v);
}

// ── THE TURN LOOP ─────────────────────────────────────────────
function sichaSend(text){
  if(SCH.busy||SCH.ended) return;
  SCH.thread.push({who:'b',he:text,en:'',unknown:null});
  SCH.history.push({role:'user',content:text});
  SCH.turns++;
  sichaTurn();
}
function sichaRetry(){ SCH.err=null; sichaTurn(); }

async function sichaTurn(){
  SCH.busy=true; SCH.err=null; ST.answered=true;   // ST.answered gates the shared keyboard
  sichaRender();
  var sc=SCH.scen;
  // Cap history growth: keep the system prompt + the last N turns rather than
  // everything, and never start the window on an assistant message.
  var msgs=SCH.history.slice(-16);
  while(msgs.length&&msgs[0].role!=='user') msgs.shift();
  if(!msgs.length) msgs=[{role:'user',content:'שלום'}];
  try{
    var r=await sichaComplete(sichaSystem(sc,SCH.slice),msgs,SICHA_TURN_MODEL,300,sichaTurnSchema());
    var he=String(r.he||'').trim();
    var ended=he.indexOf('[[END]]')>-1;
    he=he.replace(/\[\[END\]\]/g,'').trim();
    (r.glosses||[]).forEach(function(g){ if(g&&g.he) SCH.glosses[stripV(g.he)]={en:g.en,pron:g.pron}; });
    (r.taskProgress||[]).forEach(function(c){
      sc.successCriteria.forEach(function(real){
        if(String(c).trim().toLowerCase()===real.trim().toLowerCase()&&SCH.progress.indexOf(real)<0) SCH.progress.push(real);
      });
    });
    SCH.suggestions=(SCH.support==='A')?(r.suggestions||[]).slice(0,3):null;
    SCH.starter=(SCH.support==='B')?(r.starter||''):'';
    if(he){ SCH.thread.push({who:'a',he:he,en:String(r.en||''),unknown:null}); SCH.history.push({role:'assistant',content:he}); }
    if(ended||SCH.turns>=sc.maxTurns) SCH.ended=true;
    bumpDay();
  }catch(e){
    SCH.err=e;
  }
  SCH.busy=false; ST.answered=false;
  sichaRender();
  saveProgress();
}

// ── DEBRIEF ───────────────────────────────────────────────────
// The partner never corrects during the conversation (breaking communicative
// flow with grammar explanation suppresses output); the debrief corrects
// explicitly rather than by gentle hint — explicit correction outperforms
// implicit recasts, roughly 50% learner uptake versus under a third.
// Max 3 corrections: over-correction raises anxiety and pushes learners
// toward form over fluency. Three is a ceiling, not a target.
function sichaDebriefSchema(){
  return {type:'object',properties:{
    taskAchieved:{type:'boolean'},
    corrections:{type:'array',items:{type:'object',properties:{
      said:{type:'string'},better:{type:'string'},why:{type:'string'},
      type:{type:'string',enum:['gender','tense','word-order','vocab','preposition']},
      blockedMeaning:{type:'boolean'}
    },required:['said','better','why','type','blockedMeaning'],additionalProperties:false}},
    wordsUsedWell:{type:'array',items:{type:'string'}},
    wordsAvoided:{type:'array',items:{type:'string'}},
    newWordsWorthLearning:{type:'array',items:{type:'object',properties:{
      he:{type:'string'},en:{type:'string'},pron:{type:'string'}
    },required:['he','en','pron'],additionalProperties:false}},
    oneThingToPractice:{type:'string'}
  },required:['taskAchieved','corrections','wordsUsedWell','wordsAvoided','newWordsWorthLearning','oneThingToPractice'],
   additionalProperties:false};
}

async function sichaRunDebrief(){
  var sc=SCH.scen;
  document.getElementById('quizContent').innerHTML=
    '<div class="progress-label"><span>מנתח את השיחה…</span><span></span></div>'+
    '<div class="sch-typing" style="margin-top:14px"><i></i><i></i><i></i></div>'+
    '<div class="set-help">Reading the whole transcript back.</div>';
  var g=(ST.gender==='f')?'female (feminine forms are correct for her)':'male (masculine forms are correct for him)';
  var transcript=SCH.thread.map(function(m){ return (m.who==='a'?'PARTNER: ':'LEARNER: ')+m.he; }).join('\n');
  var sys='You are a Hebrew teacher reviewing one conversation a learner just had with an AI partner.\n'+
    'The learner is '+g+' — judge every gender agreement against that.\n'+
    'Scenario level: '+sc.level+' (1 = transactional present tense, 2 = multi-step past+present, 3 = opinion/negotiation).\n'+
    'Their task was: '+sc.task+'\n'+
    'Success criteria: '+sc.successCriteria.join(' | ')+'\n'+
    'These are the words that were loaded for this conversation (the learner was expected to reach for these):\n'+
    SCH.slice.map(function(w){ return w.he+' = '+w.en; }).join('; ')+'\n\n'+
    'RULES\n'+
    '- At most 3 corrections. Rank them by whether the error blocked meaning. Three is a ceiling, not a target — if only one thing mattered, return one.\n'+
    '- "why" is ONE short plain-English sentence.\n'+
    '- wordsUsedWell: words from the loaded list the learner actually produced.\n'+
    '- wordsAvoided: words from the loaded list that fit this situation but the learner routed around. This is the most valuable field — be thoughtful.\n'+
    '- newWordsWorthLearning: useful words that came up but were not in the list. Romanize pron with CAPS on the stressed syllable.\n'+
    '- Judge only the LEARNER lines. Return JSON only.';
  try{
    var d=await sichaComplete(sys,[{role:'user',content:transcript}],SICHA_DEBRIEF_MODEL,1500,sichaDebriefSchema());
    d.corrections=(d.corrections||[]).sort(function(a,b){ return (b.blockedMeaning?1:0)-(a.blockedMeaning?1:0); }).slice(0,3);
    SCH.debrief=d;
    SCH.active=false;
    sichaWriteBack(d);
    sichaRenderDebrief();
  }catch(e){
    SCH.err=e; SCH.ended=true; SCH.active=true;
    sichaRender();
  }
}

// ── WRITE-BACK TO THE EXISTING SRS ────────────────────────────
// HARD RULE: nothing derived from the model's GRAMMAR judgment may move the
// SRS. Only the confident signals — word appeared / word didn't appear — write
// to ST.srs, and "appeared" is verified against the transcript rather than
// taken on the model's word. Corrections are advisory only.
function sichaSaidTokens(){
  var set={};
  SCH.thread.forEach(function(m){
    if(m.who!=='b') return;
    stripV(m.he).split(/[^א-ת]+/).forEach(function(t){ if(t) set[t]=1; });
  });
  return set;
}
function sichaAppeared(he,tokens){
  var parts=stripV(he).split(/[^א-ת]+/).filter(function(t){return t;});
  if(!parts.length) return false;
  for(var i=0;i<parts.length;i++) if(!tokens[parts[i]]) return false;
  return true;
}
function sichaBumpSrs(he,steps){
  var s=ST.srs[he]||{level:0,nextAt:0};
  var lvl=Math.max(0,Math.min(s.level+steps,5));
  ST.srs[he]={level:lvl,nextAt:Date.now()+srsInt(lvl)};
  if(steps>0) ST.learned.add(he);
}
function sichaWriteBack(d){
  var said=sichaSaidTokens();
  var sliceBy={}; SCH.slice.forEach(function(w){ sliceBy[w.he]=w; });

  // Producing a word in live conversation is stronger evidence of knowing it
  // than clicking "got it" on a flashcard — advance two levels, not one.
  // Credit any vocab word the learner verifiably produced, not just slice
  // words: they typed it, so they know it. The 3-character floor keeps
  // one- and two-letter particles from matching as noise.
  var used=0, credited={};
  vocab.forEach(function(w){
    if(credited[w.he]) return;
    if(!sliceBy[w.he] && stripV(w.he).replace(/[^א-ת]/g,'').length<3) return;
    if(sichaAppeared(w.he,said)){ credited[w.he]=1; trackW(w.he,true); sichaBumpSrs(w.he,2); used++; }
  });
  // Not an error, but it means the word is not retrievable under pressure.
  // Restricted to the intersection of the model's list, the slice, and words
  // that verifiably did not appear.
  (d.wordsAvoided||[]).forEach(function(he){
    if(sliceBy[he]&&!sichaAppeared(he,said)) trackW(he,false);
  });
  (d.corrections||[]).forEach(function(c,i){
    if(SCH.dismissed[i]) return;
    var t=c.type||'other';
    ST.grammarErrors[t]=(ST.grammarErrors[t]||0)+1;
  });
  var mins=SCH.startedAt?((Date.now()-SCH.startedAt)/60000):0;
  ST.sichaMinutes=(ST.sichaMinutes||0)+mins;
  ST.total+=used; ST.correct+=used;
  updateStats(); saveProgress();
}
function sichaDismiss(i){
  if(SCH.dismissed[i]) return;
  SCH.dismissed[i]=1;
  var c=SCH.debrief.corrections[i], t=(c&&c.type)||'other';
  if(ST.grammarErrors[t]) ST.grammarErrors[t]=Math.max(0,ST.grammarErrors[t]-1);
  saveProgress(); sichaRenderDebrief();
}
function sichaAddWord(i){
  var w=SCH.debrief.newWordsWorthLearning[i]; if(!w||SCH.added[i]) return;
  var exists=vocab.some(function(v){return stripV(v.he)===stripV(w.he);})||
             (ST.userVocab||[]).some(function(v){return stripV(v.he)===stripV(w.he);});
  if(!exists) ST.userVocab.push({he:w.he,en:w.en,pron:w.pron,cat:'My Words',level:SCH.scen?SCH.scen.level:2});
  SCH.added[i]=1; _knownSet=null;
  saveProgress(); sichaRenderDebrief();
}

function sichaRenderDebrief(){
  var d=SCH.debrief, sc=SCH.scen;
  var said=sichaSaidTokens();
  var transcript=SCH.thread.map(function(m){
    if(m.who==='a') return '<div class="conv-bubble side-a"><span class="heb">'+esc(m.he)+'</span></div>';
    return '<div class="conv-bubble side-b"><div class="spkr">you</div><span class="heb">'+esc(m.he)+'</span></div>';
  }).join('');

  var corr=(d.corrections||[]).map(function(c,i){
    return '<div class="sch-db-block'+(SCH.dismissed[i]?' dismissed':'')+'">'+
      '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px">'+
        '<span class="sch-db-type">'+esc(c.type)+(c.blockedMeaning?' · blocked meaning':'')+'</span>'+
        (SCH.dismissed[i]?'<span class="sch-db-type">dismissed</span>':'<button class="sch-db-dismiss" onclick="sichaDismiss('+i+')">dismiss</button>')+
      '</div>'+
      '<span class="sch-db-said he-text">'+esc(c.said)+'</span>'+
      '<span class="sch-db-better he-text">'+esc(c.better)+'</span>'+
      '<div class="sch-db-why">'+esc(c.why)+'</div>'+
    '</div>';
  }).join('') || '<div class="set-help">No corrections worth making. That is a good sign.</div>';

  function wordList(arr,cls){
    if(!arr||!arr.length) return '<div class="set-help">—</div>';
    return '<div class="sch-wordlist">'+arr.map(function(he){
      var v=null; SCH.slice.forEach(function(w){ if(w.he===he) v=w; });
      return '<div class="sch-word"'+(cls?' style="border-color:'+cls+'"':'')+'>'+
        '<span class="ww-he he-text">'+esc(he)+'</span>'+(v?'<span class="ww-en">'+esc(v.en)+'</span>':'')+'</div>';
    }).join('')+'</div>';
  }
  var newWords=(d.newWordsWorthLearning||[]).map(function(w,i){
    return '<div class="sch-word"><span class="ww-he he-text">'+esc(w.he)+'</span>'+
      '<span class="ww-en">'+esc(w.en)+' · '+esc(w.pron)+'</span>'+
      (SCH.added[i]?'<span class="ww-en" style="color:var(--green)"> added</span>':'<button class="sch-add" onclick="sichaAddWord('+i+')">+ add</button>')+
    '</div>';
  }).join('') || '<div class="set-help">—</div>';

  // Focus pool for "practice these now": avoided words plus any vocab word
  // named in a correction. Both are real vocab entries, so Type It can drill them.
  var focus=[];
  (d.wordsAvoided||[]).forEach(function(he){ if(vocab.some(function(v){return v.he===he;})&&focus.indexOf(he)<0) focus.push(he); });
  (d.corrections||[]).forEach(function(c){
    var blob=stripV((c.said||'')+' '+(c.better||''));
    vocab.forEach(function(v){ if(v.he.length>2&&blob.indexOf(stripV(v.he))>-1&&focus.indexOf(v.he)<0) focus.push(v.he); });
  });

  var done=sc.successCriteria.filter(function(c){return SCH.progress.indexOf(c)>-1;}).length;
  document.getElementById('quizContent').innerHTML=
    '<div class="progress-label"><span>סיכום — debrief</span><span>'+done+'/'+sc.successCriteria.length+' criteria</span></div>'+
    '<div class="sch-task"><div class="sch-task-lbl">'+(d.taskAchieved?'Task achieved':'Task not completed')+'</div>'+
      '<div class="sch-task-title">'+esc(d.oneThingToPractice||'')+'</div>'+
      '<div class="sch-task-sub">One thing to practise before your next conversation.</div></div>'+
    '<div class="sch-sec-lbl">The conversation</div>'+
    '<div class="conv-thread">'+transcript+'</div>'+
    '<div class="sch-sec-lbl">Corrections</div>'+corr+
    '<div class="sch-sec-lbl">You used these well</div>'+wordList(d.wordsUsedWell,'var(--green)')+
    '<div class="sch-sec-lbl" style="color:var(--teal)">You dodged these</div>'+
    '<div class="set-help" style="margin-top:-4px;margin-bottom:8px">In your vocabulary, fitted the situation, and you found a way around them.</div>'+
    wordList(d.wordsAvoided,'var(--teal)')+
    '<div class="sch-sec-lbl">Worth learning</div><div class="sch-wordlist">'+newWords+'</div>'+
    '<div class="quiz-actions" style="margin-top:18px">'+
      (focus.length?'<button class="btn" onclick="sichaPractice('+JSON.stringify(focus).replace(/"/g,'&quot;')+')">Practice these now ('+focus.length+') </button>':'')+
      '<button class="btn-ghost" onclick="sichaReplay()">↺ Replay this scenario</button>'+
      '<button class="btn-ghost" onclick="sichaExit()">Pick another situation</button>'+
    '</div>';
}
function sichaPractice(list){
  ST.focusList=list; SCH.debrief=null; SCH.active=false;
  setMode('type');
}
function sichaReplay(){ var id=SCH.scen.id; SCH.debrief=null; startSicha(id); }

// ── BACKUP / RESTORE ──────────────────────────────────────────
// Storage is per-origin: a Safari tab and the installed home-screen app do NOT
// share progress, and clearing website data wipes it. Export is the escape hatch.
// The API key is deliberately NOT included — it is a credential, and a backup
// file syncs to iCloud in the clear.
function exportProgress(){
  var payload={app:'jewolingo',version:1,exportedAt:new Date().toISOString(),
               progress:JSON.parse(localStorage.getItem('jw_progress')||'{}')};
  var name='jewolingo-backup-'+dayKey()+'.json';
  var blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  var file=null;
  try{ file=new File([blob],name,{type:'application/json'}); }catch(e){}
  // On iOS the share sheet is how you get a file into Files / iCloud Drive.
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file],title:'Jewolingo backup'}).catch(function(){});
    return;
  }
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
}
function importProgress(input){
  var f=input&&input.files&&input.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(){
    var p=null;
    try{ var d=JSON.parse(r.result); p=d&&d.progress?d.progress:d; }catch(e){}
    if(!p||typeof p!=='object'||Array.isArray(p)){
      toast('That is not a Jewolingo backup','bad'); input.value=''; return;
    }
    if(!confirm('Replace your current progress with this backup? This cannot be undone.')){ input.value=''; return; }
    try{ localStorage.setItem('jw_progress',JSON.stringify(p)); }catch(e){}
    location.reload();
  };
  r.readAsText(f);
}

// ── PROGRESS PERSISTENCE (localStorage) ───────────────────────
function saveProgress(){
  try{
    localStorage.setItem('jw_progress',JSON.stringify({
      score:ST.score,streak:ST.streak,total:ST.total,correct:ST.correct,
      learned:[...ST.learned],srs:ST.srs,cards:ST.cards,wordStats:ST.wordStats,
      showVowels:ST.showVowels,cursiveOn:ST.cursiveOn,
      dayStreak:ST.dayStreak||0,lastDay:ST.lastDay||'',freezes:ST.freezes||0,
      gender:ST.gender||null,sichaSupport:ST.sichaSupport||{},
      userVocab:ST.userVocab||[],grammarErrors:ST.grammarErrors||{},
      sichaMinutes:ST.sichaMinutes||0,quests:ST.quests||{},checkpoints:ST.checkpoints||{}
    }));
  }catch(e){}
}
// The API key lives under its own storage key: "Reset Progress" must not
// silently destroy a credential the user pasted in.
function saveApiKey(){ try{ if(ST.apiKey) localStorage.setItem('jw_key',ST.apiKey); else localStorage.removeItem('jw_key'); }catch(e){} }
function loadApiKey(){ try{ ST.apiKey=localStorage.getItem('jw_key')||''; }catch(e){ ST.apiKey=''; } }
function loadProgress(){
  try{
    var d=JSON.parse(localStorage.getItem('jw_progress')||'null');
    if(!d)return;
    ST.score=d.score||0;ST.streak=d.streak||0;ST.total=d.total||0;ST.correct=d.correct||0;
    ST.learned=new Set(d.learned||[]);ST.srs=d.srs||{};ST.wordStats=d.wordStats||{};
    ST.cards=d.cards||{};
    // One-time migration: the old single SRS store measured RECOGNITION
    // (flashcards and multiple choice drove it), so it seeds the R card only.
    // Production starts fresh on purpose — typing is a different skill and
    // must not inherit stability it never earned.
    if(!d.cards && d.srs){
      Object.keys(d.srs).forEach(function(he){
        var o=d.srs[he];
        ST.cards[itemWord(he)+'|R']={n:o.level||0,due:o.nextAt||0,reps:Math.max(1,o.level||0),lapses:0};
      });
    }
    ST.dayStreak=d.dayStreak||0;ST.lastDay=d.lastDay||'';ST.freezes=d.freezes||0;
    ST.gender=d.gender||null;ST.sichaSupport=d.sichaSupport||{};
    ST.userVocab=d.userVocab||[];ST.grammarErrors=d.grammarErrors||{};
    ST.sichaMinutes=d.sichaMinutes||0;
    ST.quests=d.quests||{};ST.checkpoints=d.checkpoints||{};
    if(d.showVowels){ST.showVowels=true;
      var b=document.getElementById('vowelBtn');if(b)b.classList.add('on');
      var l=document.getElementById('vowelLbl');if(l)l.textContent='ON';}
    if(d.cursiveOn){ST.cursiveOn=true;document.body.classList.add('cursive-on');
      var cb=document.getElementById('cursiveBtn');if(cb)cb.classList.add('on');
      var cl=document.getElementById('cursiveLbl');if(cl)cl.textContent='Cursive';}
  }catch(e){}
}
// Local calendar day. toISOString() is UTC, so an evening session west of
// Greenwich was being filed under tomorrow — the streak advanced a day early
// and then broke the next morning.
function dayKey(d){
  d=d||new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function daysBetween(a,b){
  var pa=a.split('-'),pb=b.split('-');
  var da=Date.UTC(+pa[0],+pa[1]-1,+pa[2]), db=Date.UTC(+pb[0],+pb[1]-1,+pb[2]);
  return Math.round((db-da)/864e5);
}
// A streak you can lose to one bad day stops being motivating and starts
// being a reason to quit. Freezes are earned by showing up, spent silently.
function bumpDay(){
  var today=dayKey();
  if(ST.lastDay===today) return;
  if(!ST.lastDay){ ST.dayStreak=1; ST.lastDay=today; ST.freezes=ST.freezes||0; return; }
  var gap=daysBetween(ST.lastDay,today);
  if(gap<=0){ ST.lastDay=today; return; }           // clock moved backwards
  var missed=gap-1;
  ST.freezes=ST.freezes||0;
  if(missed>0){
    if(missed<=ST.freezes){ ST.freezes-=missed; ST.frozeFor=missed; }
    else { ST.dayStreak=0; ST.freezes=0; ST.frozeFor=0; }
  } else ST.frozeFor=0;
  ST.dayStreak=(ST.dayStreak||0)+1;
  ST.lastDay=today;
  // One freeze per 5 consecutive days, capped at 3.
  if(ST.dayStreak%5===0 && ST.freezes<3) ST.freezes++;
  if(ST.frozeFor>0) setTimeout(function(){
    toast(' Streak freeze used — '+ST.dayStreak+' days still going','good'); }, 700);
}
function resetProgress(){
  if(confirm('Reset ALL saved progress (score, streaks, SRS, word stats)? This cannot be undone.')){
    try{localStorage.removeItem('jw_progress');}catch(e){}
    location.reload();
  }
}

// ── KEYBOARD SHORTCUTS ────────────────────────────────────────
document.addEventListener('keydown',function(e){
  var t=e.target;
  if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'))return;
  var inTest=document.getElementById('testOverlay').classList.contains('open');
  var scope=inTest?'#testOverlay ':'#quizContent ';
  var n=parseInt(e.key,10);
  if(n>=1&&n<=9){
    // flashcard grading: 1 = missed, 2 = got it (when actions are showing)
    if(!inTest&&ST.mode==='flashcard'){
      var act=document.getElementById('fcAct');
      if(act&&act.style.display!=='none'){ if(n===1)gradeCard(false); else if(n===2)gradeCard(true); return; }
    }
    var btns=document.querySelectorAll(scope+'.mc-opt:not(:disabled), '+scope+'.conv-opt, '+scope+'.shoresh-opt:not(:disabled)');
    if(btns[n-1])btns[n-1].click();
  } else if(e.key===' '&&!inTest&&ST.mode==='flashcard'){
    var fc=document.getElementById('fc');
    if(fc){e.preventDefault();flipCard();}
  }
});

// ── INIT ───────────────────────────────────────────────────────
loadProgress(); loadApiKey(); renderModes(); renderCats(); renderLevels(); updateSelLabels(); updateStats();
showView('Today');
// Repaint once annotations land, so slot quality improves without blocking boot.
loadAnnotations().then(function(){ if(!ROUND.active&&!CHK.active) showView(VIEW); });

// ── PWA ───────────────────────────────────────────────────────
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
  // Show a new build as soon as it takes over, instead of on the SECOND launch
  // (which looks exactly like a failed deploy). Never mid-answer: a round,
  // checkpoint or open Practice question lives only in memory, so then the
  // new version simply opens next time. A first install has nothing stale.
  var _hadSW=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange',function(){
    if(!_hadSW) return;
    var tst=document.getElementById('testOverlay');
    if(ROUND.active||CHK.active||document.body.classList.contains('pfocus')||(tst&&tst.classList.contains('open'))) return;
    location.reload();
  });
  // Standalone apps resume without navigating, so check for updates on return.
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState!=='visible') return;
    navigator.serviceWorker.getRegistration().then(function(r){ if(r) r.update(); }).catch(function(){});
  });
}
// Ask the browser not to evict our storage. Home-screen web apps are already
// exempt from WebKit's 7-day cap, but this is free insurance elsewhere.
if(navigator.storage&&navigator.storage.persist){ navigator.storage.persist().catch(function(){}); }
// iOS Safari only applies :active (key press states, the key callout) once a
// touch listener exists on the page.
document.addEventListener('touchstart',function(){},{passive:true});
applyTheme();   // theme-color meta to match (the early script already set data-theme)

</script>
