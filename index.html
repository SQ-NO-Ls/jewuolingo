<style>

:root {
  /* LEDGER — ink on paper, read at night. Near-black with a blue tint
     rather than #000: #000 leaves no room for elevation and smears on OLED
     during momentum scroll. Text is off-white, not white, to avoid halation. */
  --bg:#0E0F14; --surface:#16181F; --surface2:#1E2029; --surface3:#272A35;
  --border:#2E3140;
  --text:#E6E4DE; --text2:#A6A8B3; --muted:#A6A8B3; --text3:#8A8D9A;

  /* Periwinkle, flat and small-area, with DARK text on the fill. Inverting
     the default white-on-blue is the single most distinctive move here. */
  --accent:#9AA3E8; --accent-hi:#B3BAF0; --accent-muted:#262A47;
  --blue:#9AA3E8; --blue-dim:#2E3140; --blue-glow:transparent;
  --blue-soft:#262A47;

  /* Semantics warm-shifted so they do not fight the cool accent. */
  --green:#7FBF9A; --rose:#E58F8F; --red:#E58F8F;
  --warning:#D9B46A; --teal:#D9B46A; --orange:#D9B46A; --yellow:#D9B46A;

  /* Level ramp: ONE hue, ordered by LIGHTNESS. Fills only, never text.
     Lightness survives every colour-vision deficiency; hue does not. */
  --lv1:#2E3157; --lv2:#3D4275; --lv3:#505693;
  --lv4:#6A71B3; --lv5:#8C92D2; --lv6:#B5B9EE;

  /* Two radii with distinct jobs. No pills. */
  --r-sm:4px; --r-md:8px; --radius:8px;
  --he-font:'Frank Ruhl Libre',serif;
  --he-cursive:'Gveret Levin',cursive;
  --ui-font:'Source Serif 4',Georgia,serif;
  --he-scale:1.15;
  --ease:cubic-bezier(.2,.8,.2,1);
  /* Theme-dependent roles. Dark text on the accent fill in BOTH themes; the
     accent as TEXT needs a deeper ink on paper to stay readable. */
  --on-accent:#0E0F14; --accent-ink:#9AA3E8;
  --key-shadow:rgba(0,0,0,.35); --thumb-shadow:rgba(0,0,0,.4);
  --status-band:transparent; --map-unseen:#1E2029;
  /* map states by lightness: unseen < met < recognised < secure, in each theme */
  --map-met:#3E4150; --map-seen:#5E64AD; --map-secure:#9AA3E8;
  --accent-line:#9AA3E8;   /* thin progress fills and markers */
  color-scheme:dark;
}
/* ── PAPER: the light theme ──────────────────────────────────
   Same rules as Ledger: never white, never black, dark text on the accent
   fill, one accent per screen, levels by lightness. Warm paper rather than
   blue-white, so serif Hebrew reads like a printed page. */
:root[data-theme="paper"]{
  color-scheme:light;
  --bg:#F4F1EA; --surface:#FBF9F4; --surface2:#EEEAE1; --surface3:#E4DFD4;
  --border:#D9D3C6;
  --text:#1D1C1A; --text2:#55534E; --muted:#55534E; --text3:#6B6862;
  --accent:#9AA3E8; --accent-hi:#B3BAF0; --accent-muted:#E3E5F7; --accent-ink:#3D479E;
  --blue:#3D479E; --blue-dim:#D9D3C6; --blue-soft:#E3E5F7;
  --green:#2F7550; --rose:#A8423F; --red:#A8423F;
  --warning:#7A5E18; --teal:#7A5E18; --orange:#7A5E18; --yellow:#7A5E18;
  /* on paper the ramp darkens with level: more contrast = further along */
  --lv1:#DCDDF0; --lv2:#C3C6EA; --lv3:#A6AADF; --lv4:#8188CC; --lv5:#5E66B3; --lv6:#3D479E;
  --on-accent:#1D1C1A;
  --key-shadow:rgba(60,50,30,.18); --thumb-shadow:rgba(0,0,0,.22);
  /* iOS fixes the status-bar style at install (black-translucent = white
     icons), so on paper a dark band sits behind the status bar to keep the
     clock and battery legible. */
  --status-band:#1D1C1A; --map-unseen:#E2DCCF;
  /* on paper progress DARKENS: more learned = more ink */
  --map-met:#B5AFA3; --map-seen:#8188CC; --map-secure:#3D479E;
  --accent-line:#5E66B3;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
/* no starfield: a decorative gradient layer is exactly the 'glamour' tell */
button,input,select,textarea{font-family:inherit;}
button{color:inherit;}
.i{width:20px;height:20px;display:inline-block;vertical-align:middle;
  fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
/* Hebrew always declares itself and never changes line box when niqqud toggles */
.he-text,.he{font-family:var(--he-font);line-height:1.9;}
.num,.rank{font-variant-numeric:tabular-nums lining-nums;unicode-bidi:isolate;direction:ltr;}
:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px;}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
header{text-align:center;padding:10px 0 8px;}

/* STATS BAR */
.toggle-btn{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r-sm);padding:6px 14px;min-height:40px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:6px;transition:background .12s var(--ease),border-color .12s var(--ease),color .12s var(--ease);font-family:var(--ui-font);user-select:none;}
.toggle-btn .he-icon{font-family:var(--he-font);font-size:16px;font-weight:700;}
.analytics-btn{background:var(--surface);border:1px solid var(--blue-dim);border-radius:var(--r-sm);padding:7px 14px;min-height:40px;font-size:12px;font-weight:600;color:var(--blue);cursor:pointer;display:flex;align-items:center;gap:6px;transition:background .12s var(--ease),border-color .12s var(--ease),color .12s var(--ease);font-family:var(--ui-font);margin-left:auto;}
@media (hover:hover) and (pointer:fine){.analytics-btn:hover{background:var(--blue-soft);}}

/* MODE GRID */
@media(max-width:640px){.mode-grid{grid-template-columns:repeat(3,1fr);}}

/* CAT + LEVEL TABS */
.category-tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
.cat-tab{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:5px 14px;min-height:40px;display:inline-flex;align-items:center;font-size:11px;cursor:pointer;color:var(--muted);font-weight:500;font-family:var(--ui-font);transition:background .12s var(--ease),border-color .12s var(--ease),color .12s var(--ease);}
.cat-tab.active{border-color:var(--blue);color:var(--blue);background:var(--blue-soft);}
.level-tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
.level-tab{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r-sm);padding:5px 14px;min-height:40px;font-size:11px;cursor:pointer;color:var(--muted);font-weight:700;font-family:var(--ui-font);transition:background .12s var(--ease),border-color .12s var(--ease),color .12s var(--ease);display:flex;align-items:center;gap:5px;}
@media (hover:hover) and (pointer:fine){.level-tab:hover{border-color:var(--blue-dim);color:var(--text);}}
.lvl-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
.level-tab.active{border-color:var(--blue);color:var(--blue);background:var(--blue-soft);}
.lvl1 .lvl-dot{background:var(--lv1);}
.lvl2 .lvl-dot{background:var(--lv2);}
.lvl3 .lvl-dot{background:var(--lv3);}
.lvl4 .lvl-dot{background:var(--lv4);}
.lvl5 .lvl-dot{background:var(--lv5);}
.lvl6 .lvl-dot{background:var(--lv6);}

/* QUIZ CARD */
.quiz-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:48px 56px;min-height:64vh;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden;}
@media(max-width:640px){.quiz-card{padding:32px 22px;min-height:60vh;}}
.progress-label{font-size:11px;color:var(--muted);margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;}

/* PRON BUTTON */
.pron-wrap{display:flex;flex-direction:column;align-items:center;gap:5px;}
.pron-reveal{font-size:14px;color:var(--text3);letter-spacing:1px;font-style:italic;opacity:0;max-height:0;overflow:hidden;transition:opacity .2s,max-height .25s;text-align:center;}
.pron-reveal.show{opacity:1;max-height:44px;}

/* HEBREW TEXT */
.he-text{font-family:var(--he-font);}
body.cursive-on .he-text{font-family:var(--he-cursive);}

/* FLASHCARD */
.flashcard-wrap{perspective:1000px;height:280px;cursor:pointer;margin-bottom:16px;}
.flashcard{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .28s var(--ease);}
.flashcard.flipped{transform:rotateY(180deg);}
.card-face{position:absolute;inset:0;backface-visibility:hidden;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-md);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;}
.card-back{transform:rotateY(180deg);background:var(--surface);border-color:var(--border);}
.card-he{font-size:72px;font-weight:700;color:var(--text);direction:rtl;line-height:1.1;}
.card-en{font-size:28px;font-weight:400;color:var(--text);}
.card-hint{font-size:12px;color:var(--muted);}
.card-cat{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);}
.srs-dots{display:flex;gap:4px;}
.srs-dot{width:6px;height:6px;border-radius:50%;background:var(--border);}
.srs-dot.lit{background:var(--blue);}

/* MULTIPLE CHOICE */
.mc-question{text-align:center;margin-bottom:24px;display:flex;flex-direction:column;align-items:center;gap:10px;}
.mc-he{font-size:72px;color:var(--text);direction:rtl;display:block;line-height:1.1;}
.mc-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.mc-opt{background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--r-md);padding:18px 22px;cursor:pointer;font-size:17px;font-weight:500;transition:background .12s var(--ease),border-color .12s var(--ease),color .12s var(--ease);text-align:left;color:var(--text);font-family:var(--ui-font);}
@media (hover:hover) and (pointer:fine){.mc-opt:hover:not(:disabled){border-color:var(--blue-dim);background:var(--blue-soft);}}
.mc-opt.correct{border-color:var(--green);color:var(--green);}
.mc-opt.wrong{border-color:var(--rose);color:var(--rose);}
.mc-opt:disabled{cursor:default;}

/* TYPE IT */
.type-english{font-size:32px;font-weight:300;color:var(--text);text-align:center;margin-bottom:8px;}
.type-input-wrap{display:flex;gap:10px;margin-bottom:8px;}
.type-input{flex:1;min-width:0;background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--r-md);padding:16px 20px;color:var(--text);font-size:28px;font-family:var(--he-font);direction:rtl;outline:none;transition:background .12s var(--ease),border-color .12s var(--ease),color .12s var(--ease);}
.type-input:focus{border-color:var(--blue-dim);}
.type-input.good{border-color:var(--green);}
.type-input.bad{border-color:var(--rose);}
.type-feedback{text-align:center;font-size:16px;min-height:26px;margin-bottom:6px;}

/* MATCH */
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.match-col{display:flex;flex-direction:column;gap:8px;}
.match-item{background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--r-md);padding:16px 18px;cursor:pointer;transition:background .12s var(--ease),border-color .12s var(--ease),color .12s var(--ease);font-size:16px;font-weight:500;user-select:none;}
.match-item.he-side{font-size:26px;direction:rtl;text-align:right;color:var(--text);line-height:1.3;font-family:var(--he-font);}
body.cursive-on .match-item.he-side{font-family:var(--he-cursive);}
@media (hover:hover) and (pointer:fine){.match-item:hover:not(.matched):not(.wrong-flash){border-color:var(--blue-dim);}}
.match-item.selected{border-color:var(--blue);background:var(--blue-soft);}
.match-item.matched{border-color:var(--green);color:var(--green);opacity:.65;pointer-events:none;}
.match-item.wrong-flash{border-color:var(--rose);}
.match-pron{font-size:10px;color:var(--text3);font-style:italic;margin-top:3px;direction:ltr;text-align:left;font-family:var(--ui-font);}

/* FILL IN */
.sentence-box{font-size:24px;line-height:2;margin-bottom:16px;text-align:center;padding:24px;background:var(--surface2);border-radius:var(--r-md);border:1px solid var(--border);}
.blank-slot{display:inline-block;min-width:90px;max-width:100%;border-bottom:2px solid var(--blue);padding:2px 10px;font-size:28px;color:var(--text);direction:rtl;background:transparent;border-top:none;border-left:none;border-right:none;outline:none;vertical-align:middle;text-align:center;font-family:var(--he-font);}
body.cursive-on .blank-slot{font-family:var(--he-cursive);}
.sentence-hint-line{color:var(--muted);font-size:13px;text-align:center;margin-bottom:14px;}
.word-bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:8px;}
.bank-word{background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--r-md);padding:10px 16px;cursor:pointer;transition:background .12s var(--ease),border-color .12s var(--ease),color .12s var(--ease);color:var(--text);text-align:center;}
@media (hover:hover) and (pointer:fine){.bank-word:hover{border-color:var(--blue-dim);}}
.bank-word.used{opacity:.3;pointer-events:none;}
.bank-he{font-size:26px;direction:rtl;display:block;font-family:var(--he-font);}
body.cursive-on .bank-he{font-family:var(--he-cursive);}
.bank-pron{font-size:10px;color:var(--text3);font-style:italic;display:block;margin-top:2px;}

/* CONVERSATION */
.conv-top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.conv-scenario-box{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-md);padding:14px 18px;margin-bottom:16px;}
.conv-scenario-lbl{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--blue);margin-bottom:4px;}
.conv-scenario-title{font-size:16px;font-weight:600;color:var(--text);}
.conv-scenario-sub{font-size:12px;color:var(--muted);margin-top:2px;}
.conv-thread{display:flex;flex-direction:column;gap:10px;margin-bottom:14px;}
.conv-bubble{max-width:82%;padding:10px 14px;border-radius:var(--r-md);font-size:14px;line-height:1.5;}
.conv-bubble.side-a{align-self:flex-start;background:var(--surface2);border:1px solid var(--border);border-bottom-left-radius:4px;}
.conv-bubble.side-b{align-self:flex-end;background:var(--accent-muted);border:1px solid var(--blue-dim);border-bottom-right-radius:4px;}

.conv-opt{background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--r-md);padding:12px 15px;cursor:pointer;transition:background .12s var(--ease),border-color .12s var(--ease),color .12s var(--ease);font-size:14px;font-family:var(--ui-font);color:var(--text);}
.conv-opt .opt-he{font-size:18px;direction:rtl;display:block;margin-bottom:3px;color:var(--text);font-family:var(--he-font);}

.conv-opt .opt-pron{font-size:11px;color:var(--text3);font-style:italic;display:block;}
@media (hover:hover) and (pointer:fine){.conv-opt:hover:not(:disabled){border-color:var(--blue-dim);background:var(--blue-soft);}}
.conv-opt.correct{border-color:var(--green);}
.conv-opt.wrong{border-color:var(--rose);}

.conv-pip.done{background:var(--blue);}

/* KEYBOARD */

/* SHORESH MODE */
.shoresh-root-display{text-align:center;margin-bottom:20px;}
.shoresh-root-letters{display:flex;justify-content:center;gap:12px;margin:16px 0;direction:rtl;}
.shoresh-letter-box{width:72px;height:72px;background:var(--surface2);border:2px solid var(--border);border-radius:var(--r-md);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--he-font);font-size:40px;font-weight:900;color:var(--text);position:relative;}
body.cursive-on .shoresh-letter-box{font-family:var(--he-cursive);}
.shoresh-letter-box .sh-num{font-family:var(--ui-font);font-size:9px;color:var(--blue);position:absolute;top:4px;right:6px;letter-spacing:1px;}
.shoresh-letter-box.revealed{border-color:var(--accent-ink);background:var(--accent-muted);}
.shoresh-words{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0;}
.shoresh-word-chip{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-md);padding:8px 14px;text-align:center;}
.shoresh-word-chip .sw-he{font-family:var(--he-font);font-size:22px;color:var(--text);direction:rtl;display:block;}

.shoresh-word-chip .sw-en{font-size:11px;color:var(--muted);display:block;margin-top:2px;}
.shoresh-quiz-prompt{font-size:16px;text-align:center;color:var(--muted);margin-bottom:14px;}
.shoresh-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.shoresh-opt{background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--r-md);padding:14px 16px;cursor:pointer;text-align:center;transition:background .12s var(--ease),border-color .12s var(--ease),color .12s var(--ease);font-family:var(--ui-font);}
@media (hover:hover) and (pointer:fine){.shoresh-opt:hover:not(:disabled){border-color:var(--blue-dim);background:var(--blue-soft);}}
.shoresh-opt.correct{border-color:var(--green);color:var(--green);}
.shoresh-opt.wrong{border-color:var(--rose);color:var(--rose);}
.shoresh-opt:disabled{cursor:default;}
.shoresh-opt .sopt-root{font-family:var(--he-font);font-size:26px;color:var(--text);direction:rtl;display:block;margin-bottom:3px;}
body.cursive-on .shoresh-opt .sopt-root{font-family:var(--he-cursive);}
.shoresh-opt .sopt-pron{font-size:10px;color:var(--text3);font-style:italic;}
.shoresh-opt .sopt-meaning{font-size:11px;color:var(--muted);margin-top:3px;display:block;}
body.cursive-on .kbd-key{font-family:var(--he-cursive);}
@media (hover:hover) and (pointer:fine){.kbd-key:hover{border-color:var(--blue-dim);background:var(--blue-soft);color:var(--blue);}}

/* ALPHABET MODE */
.aleph-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
@media(max-width:540px){.aleph-grid{grid-template-columns:repeat(3,1fr);}}
.aleph-card{background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--r-md);padding:16px 10px;text-align:center;cursor:pointer;transition:all .18s;user-select:none;}
@media (hover:hover) and (pointer:fine){.aleph-card:hover{border-color:var(--blue-dim);}}
.aleph-letter{font-family:var(--he-font);font-size:44px;font-weight:900;color:var(--text);direction:rtl;line-height:1;display:block;}
body.cursive-on .aleph-letter{font-family:var(--he-cursive);}
.aleph-name{font-size:13px;font-weight:700;color:var(--blue);margin-top:6px;display:block;}
.aleph-sound{font-size:11px;color:var(--muted);margin-top:2px;display:block;}
.aleph-final{font-size:11px;color:var(--teal);margin-top:2px;display:block;}
.aleph-quiz-letter{font-family:var(--he-font);font-size:120px;font-weight:900;color:var(--text);text-align:center;display:block;margin:14px 0;}
body.cursive-on .aleph-quiz-letter{font-family:var(--he-cursive);}
.aleph-reveal{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-md);padding:18px;text-align:center;margin:16px 0;}

/* GRAMMAR MODE */
.gram-tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
.gram-tab{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-sm);padding:6px 16px;min-height:40px;display:inline-flex;align-items:center;font-size:12px;cursor:pointer;color:var(--muted);font-weight:500;font-family:var(--ui-font);transition:background .12s var(--ease),border-color .12s var(--ease),color .12s var(--ease);}
.gram-tab.active{border-color:var(--blue);color:var(--blue);background:var(--blue-soft);}
.gram-wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;}
.gram-table{width:100%;border-collapse:collapse;font-size:14px;}
.gram-table th{background:var(--surface2);color:var(--blue);font-size:11px;letter-spacing:2px;text-transform:uppercase;padding:8px 12px;text-align:left;border:1px solid var(--border);}
.gram-table td{padding:10px 12px;border:1px solid var(--border);vertical-align:top;}
.gram-he{font-family:var(--he-font);font-size:20px;color:var(--text);direction:rtl;display:block;}
body.cursive-on .gram-he{font-family:var(--he-cursive);}
.gram-pron{font-size:11px;color:var(--text3);font-style:italic;display:block;margin-top:2px;}

/* SHARED BUTTONS */
.btn{background:var(--accent);color:var(--on-accent);border:none;border-radius:var(--r-sm);padding:13px 26px;font-size:15px;font-weight:600;cursor:pointer;font-family:var(--ui-font);min-height:44px;transition:background .12s var(--ease);}
.btn:active{background:var(--accent-hi);transform:scale(.97);}
.btn:disabled{background:var(--surface3);color:var(--text3);cursor:default;}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border);border-radius:var(--r-md);padding:12px 26px;font-size:14px;font-weight:500;cursor:pointer;font-family:var(--ui-font);transition:background .12s var(--ease),border-color .12s var(--ease),color .12s var(--ease);}
@media (hover:hover) and (pointer:fine){.btn-ghost:hover{color:var(--text);border-color:var(--muted);}}
.quiz-actions{display:flex;justify-content:space-between;align-items:center;margin-top:var(--s5);gap:var(--s3);}

/* ANALYTICS */
.analytics-overlay.open{display:flex;}
.an-tabs{display:flex;gap:8px;margin-bottom:18px;}
.bar-en{font-size:11px;color:var(--muted);min-width:90px;}
.bar-good{height:100%;border-radius:4px;background:var(--accent-line);transition:width .28s var(--ease);}
.bar-cnt{font-size:12px;color:var(--muted);min-width:50px;text-align:right;}
.an-missed-btn{background:var(--accent);color:var(--on-accent);border:none;border-radius:var(--r-md);padding:10px 20px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--ui-font);margin-top:16px;}

/* TOAST */
.toast.show{transform:translateX(-50%) translateY(0);}
.toast.good{border-color:var(--green);color:var(--green);}
.toast.bad{border-color:var(--rose);color:var(--rose);}

/* COLLAPSIBLE SELECTOR BAR */
@media (hover:hover) and (pointer:fine){.sel-btn:hover{border-color:var(--blue-dim);}}
.sel-btn.active{border-color:var(--blue);background:var(--blue-soft);}
.sel-stack{display:flex;flex-direction:column;align-items:flex-start;gap:1px;}
.sel-btn.active .sel-cap{color:var(--blue);}
.sel-val{font-weight:700;font-size:14px;color:var(--text);}
.sel-btn.active .sel-val{color:var(--blue);}
.sel-car{font-size:9px;color:var(--muted);transition:transform .2s var(--ease);}
.sel-btn.active .sel-car{transform:rotate(180deg);color:var(--blue);}
.sel-panel{max-height:0;overflow:hidden;transition:max-height .3s ease;}
.sel-panel.open{max-height:640px;margin-bottom:14px;overflow-y:auto;}
.sel-panel .mode-grid,.sel-panel .category-tabs,.sel-panel .level-tabs{margin-bottom:0;padding-top:4px;}

/* TEST MODE — full screen exam */
.test-overlay{display:none;position:fixed;inset:0;background:var(--bg);z-index:400;overflow-y:auto;}
.test-overlay.open{display:block;}
.test-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;}
.test-head .th-logo{font-family:var(--he-font);font-size:30px;font-weight:900;color:var(--text2);}
@media (hover:hover) and (pointer:fine){.test-x:hover{border-color:var(--rose);color:var(--rose);}}
.test-section{margin-bottom:var(--s6);}
.test-section-lbl{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}
.test-opt-row{display:flex;gap:10px;flex-wrap:wrap;}
@media (hover:hover) and (pointer:fine){.test-chip:hover{border-color:var(--blue-dim);}}
.test-select{width:100%;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r-md);padding:14px 16px;font-size:14px;color:var(--text);font-family:var(--ui-font);cursor:pointer;outline:none;}
.test-select:focus{border-color:var(--blue-dim);}
.test-avail{text-align:center;font-size:13px;color:var(--muted);margin:6px 0 22px;}
.test-avail b{color:var(--blue);font-size:15px;}
.test-start{width:100%;background:var(--accent);color:var(--on-accent);border:none;border-radius:var(--r-md);padding:18px;font-size:17px;font-weight:700;cursor:pointer;font-family:var(--ui-font);transition:background .12s var(--ease),border-color .12s var(--ease),color .12s var(--ease);}
.test-start:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;transform:none;}
.test-prog-bar{height:6px;background:var(--surface2);border-radius:var(--r-sm);overflow:hidden;margin-bottom:7px;}
.test-prog-fill{height:100%;background:var(--accent-line);border-radius:var(--r-sm);transition:width .28s var(--ease);}
.test-prog-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:30px;}
.test-q-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;}
.test-style-tag{text-align:center;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--teal);margin-bottom:16px;}
.test-prompt-big{font-size:66px;color:var(--text);text-align:center;direction:rtl;line-height:1.15;margin-bottom:6px;}
.test-prompt-en{font-size:40px;font-weight:300;color:var(--text);text-align:center;margin-bottom:6px;}
.test-feedback{text-align:center;font-size:16px;min-height:28px;margin-top:14px;}
.test-result-score{font-size:84px;font-weight:800;text-align:center;line-height:1;}
.test-result-grade{text-align:center;font-size:22px;font-weight:700;margin:8px 0 2px;}
.test-result-sub{text-align:center;font-size:14px;color:var(--muted);margin-bottom:26px;}
.test-stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px;}
.test-stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:18px 12px;text-align:center;}
.test-stat-card .tsc-num{font-size:32px;font-weight:800;}
.test-stat-card .tsc-lbl{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-top:4px;}
.test-breakdown{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:8px 18px;margin-bottom:20px;}
.test-bd-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);padding:10px 0;border-bottom:1px solid var(--border);}
.test-bd-row:last-child{border-bottom:none;}
.test-missed-list{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:2px 18px;margin-bottom:24px;max-height:300px;overflow-y:auto;}
.test-missed-row{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--border);}
.test-missed-row:last-child{border-bottom:none;}
.test-missed-he{font-family:var(--he-font);font-size:28px;color:var(--text);direction:rtl;min-width:96px;text-align:right;}
body.cursive-on .test-missed-he{font-family:var(--he-cursive);}
.test-missed-en{font-size:13px;color:var(--text);flex:1;line-height:1.4;}
.test-missed-yours{font-size:12px;color:var(--rose);white-space:nowrap;}
.test-res-actions{display:flex;gap:10px;flex-wrap:wrap;}
.test-res-actions .btn,.test-res-actions .btn-ghost{flex:1;text-align:center;min-width:120px;}

/* ── SICHA (live AI conversation) ───────────────────────────── */
.sch-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px;flex-wrap:wrap;}
.sch-task-sub{font-size:12px;color:var(--muted);line-height:1.45;}

.sch-check-row.done{color:var(--green);}
.sch-check-box{flex:0 0 auto;width:14px;height:14px;border-radius:4px;border:1.5px solid var(--border);margin-top:1px;font-size:10px;line-height:12px;text-align:center;}
.sch-check-row.done .sch-check-box{border-color:var(--green);background:var(--green);color:var(--bg);}
.sch-turnbar{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted);margin-bottom:10px;}

.sch-typing i:nth-child(2){animation-delay:.2s;}
.sch-typing i:nth-child(3){animation-delay:.4s;}
@keyframes schBlink{0%,60%,100%{opacity:.25;}30%{opacity:1;}}
.sch-gloss-btn{background:none;border:none;padding:0;margin-top:6px;font:inherit;font-size:10px;color:var(--muted);cursor:pointer;text-transform:uppercase;letter-spacing:1px;}
@media (hover:hover) and (pointer:fine){.sch-gloss-btn:hover{color:var(--blue);}}
.sch-en{display:none;font-size:12px;color:var(--muted);margin-top:4px;font-style:italic;}
.sch-en.show{display:block;}
.sch-unk{border-bottom:2px dotted var(--teal);cursor:pointer;}
.sch-sug{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
.sicha-sug{background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--r-md);padding:12px 14px;cursor:pointer;text-align:right;transition:background .12s var(--ease),border-color .12s var(--ease),color .12s var(--ease);}
@media (hover:hover) and (pointer:fine){.sicha-sug:hover{border-color:var(--blue);background:var(--blue-soft);}}
.sicha-sug .sg-he{font-family:var(--he-font);font-size:18px;direction:rtl;display:block;color:var(--text);}
body.cursive-on .sicha-sug .sg-he{font-family:var(--he-cursive);}
.sch-bank{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.sch-bank-w{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-md);padding:6px 10px;font-size:14px;font-family:var(--he-font);direction:rtl;cursor:pointer;color:var(--text);}
@media (hover:hover) and (pointer:fine){.sch-bank-w:hover{border-color:var(--blue);color:var(--blue);}}
body.cursive-on .sch-bank-w{font-family:var(--he-cursive);}
.sch-starter{font-size:13px;color:var(--teal);margin-top:10px;direction:rtl;text-align:right;font-family:var(--he-font);}
.sch-input-row{display:flex;gap:8px;margin-top:12px;}
.sch-input:focus{border-color:var(--blue);}
body.cursive-on .sch-input{font-family:var(--he-cursive);}
.sch-err{background:none;border:none;border-left:2px solid var(--rose);border-radius:0;padding:4px 0 4px 12px;margin-top:12px;}
.sch-err-he{font-family:var(--he-font);font-size:17px;direction:rtl;color:var(--rose);display:block;margin-bottom:5px;}
.sch-err-en{font-size:13px;color:var(--text);line-height:1.5;}
.sch-scen-grid{display:flex;flex-direction:column;gap:10px;margin-top:12px;}
.sch-scen{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r-md);padding:14px;cursor:pointer;transition:background .12s var(--ease),border-color .12s var(--ease),color .12s var(--ease);}
@media (hover:hover) and (pointer:fine){.sch-scen:hover{border-color:var(--blue);}}
.sch-scen-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:5px;}
.sch-scen-he{font-family:var(--he-font);font-size:19px;color:var(--blue);direction:rtl;}

.sch-scen-en{font-size:14px;font-weight:700;}
.sch-scen-task{font-size:12px;color:var(--muted);line-height:1.45;}
.sch-lvl{font-size:10px;font-weight:700;padding:3px 8px;border-radius:var(--r-sm);border:1px solid var(--border);color:var(--muted);white-space:nowrap;}
.sch-db-block{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-md);padding:14px;margin-bottom:12px;}
.sch-db-said{font-family:var(--he-font);font-size:17px;direction:rtl;color:var(--rose);display:block;}
.sch-db-better{font-family:var(--he-font);font-size:17px;direction:rtl;color:var(--green);display:block;margin-top:4px;}

.sch-db-why{font-size:13px;color:var(--text);margin-top:7px;line-height:1.5;}
.sch-db-type{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);}
.sch-db-dismiss{background:none;border:1px solid var(--border);border-radius:var(--r-sm);color:var(--muted);font-size:11px;padding:4px 9px;cursor:pointer;font-family:var(--ui-font);}

.sch-wordlist{display:flex;flex-wrap:wrap;gap:6px;}
.sch-word{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-md);padding:6px 10px;font-size:13px;
  display:inline-flex;align-items:center;gap:8px;}
.sch-word .ww-he{font-family:var(--he-font);font-size:16px;direction:rtl;}
body.cursive-on .sch-word .ww-he{font-family:var(--he-cursive);}
.sch-word .ww-en{color:var(--muted);font-size:12px;}
.sch-add{background:none;border:none;color:var(--blue);cursor:pointer;font-size:14px;font-family:var(--ui-font);white-space:nowrap;}
.set-row{margin-bottom:var(--s6);}
.set-lbl{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:var(--s3);}
.set-help{font-size:12px;color:var(--muted);line-height:1.55;margin-top:var(--s3);}
.set-input{width:100%;background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--r-md);padding:11px 13px;font-size:14px;color:var(--text);font-family:var(--ui-font);outline:none;}

/* ── MOBILE SHELL: bottom tab bar + compact header ──────────── */
/* The old layout spent half a phone screen on chrome before the question. */
body{background:var(--bg);color:var(--text);font-family:var(--ui-font);min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased;}
.compact-head .ch-title{font-family:var(--he-font);font-size:21px;font-weight:900;
  color:var(--text2);letter-spacing:-.5px;}
.compact-head .ch-right{display:flex;gap:7px;align-items:center;}
.mini-pill b{color:var(--text);font-weight:700;}
.view{display:none;} .view.on{display:block;}

/* ── Today / the round ──────────────────────────────────────── */
.round-bar{display:flex;gap:4px;margin-bottom:14px;}
.round-bar i{flex:1;height:4px;border-radius:2px;background:var(--border);transition:background .25s;}
.round-bar i.done{background:var(--green);} .round-bar i.now{background:var(--blue);}
.round-bar i.miss{background:var(--rose);}
.today-hero{text-align:center;padding:30px 16px 24px;}
.today-hero .th-l{font-size:13px;color:var(--muted);margin-top:6px;letter-spacing:1px;text-transform:uppercase;}
.today-hero .th-sub{font-size:14px;color:var(--text);margin-top:14px;line-height:1.5;}
.big-btn:active{transform:scale(.985);}
.step-kind{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);
  text-align:center;margin-bottom:10px;}

/* ── Levels ─────────────────────────────────────────────────── */
.dim{flex:1;text-align:center;background:var(--surface2);border-radius:var(--r-sm);padding:6px 2px;}

/* ── Quests & can-dos ───────────────────────────────────────── */
.q-row.done{border-color:var(--green);color:var(--green);}
.q-row.done .q-box,.cando.done .q-box{border-color:var(--green);background:var(--green);color:var(--bg);}
 
.q-row.done .q-n{color:var(--green);}

/* ── Pattern drill ──────────────────────────────────────────── */

/* ── PWA / iPhone ───────────────────────────────────────────── */
/* Keep content clear of the notch, Dynamic Island and home indicator. */
@supports (padding:max(0px)){
  .app{
    padding-top:max(20px, env(safe-area-inset-top));
    padding-bottom:max(60px, calc(env(safe-area-inset-bottom) + 40px));
    padding-left:max(20px, env(safe-area-inset-left));
    padding-right:max(20px, env(safe-area-inset-right));
  }
  .test-overlay .test-inner{
    padding-top:max(20px, env(safe-area-inset-top));
    padding-bottom:max(20px, calc(env(safe-area-inset-bottom) + 20px));
  }
}
/* Stop iOS zooming the page when a text field is focused (<16px triggers it). */
input, textarea, select{ font-size:16px; }
.sch-input{flex:1;min-width:0;background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--r-md);padding:12px 14px;color:var(--text);direction:rtl;text-align:right;font-family:var(--he-font);outline:none;font-size:18px;}
/* Momentum scrolling + no rubber-band on the shell */
html,body{overscroll-behavior:none;overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent;}


/* ── FOCUS MODE ──────────────────────────────────────────────
   Coherence principle: strip everything not needed for THIS answer.
   The tab bar, stat pills, mode/category/level pickers and all badges
   leave, so the Hebrew word is the only thing competing for attention.
   The screen becomes a grid whose last row is the keyboard — no fixed
   positioning, so nothing can overlap the submit control. */
body.focus .tabbar,
body.focus .compact-head,
body.focus .stats-bar,
body.focus .selector-bar,
body.focus .sel-panel { display:none!important; }
body.focus .app{max-width:none;margin:0;padding:0;}
body.focus{position:fixed;inset:0;overflow:hidden;}

.focus-wrap{
  display:grid;
  grid-template-rows:auto auto 1fr auto auto auto;
  height:100dvh;
  padding-top:env(safe-area-inset-top);
  /* no bottom inset here: the last row (keyboard tray or action row) carries
     it, so the tray can run to the bottom edge like the system keyboard */
  padding-inline:var(--gutter);
}
.focus-strip{display:flex;align-items:center;gap:12px;height:44px;}
.focus-exit{width:44px;height:44px;margin-inline-start:-10px;background:none;border:none;
  color:var(--text3);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.focus-exit:active{color:var(--text);}
.seg-bar{flex:1;display:flex;gap:3px;}
.seg{flex:1;height:2px;background:var(--border);border-radius:1px;}
.seg.done{background:var(--text3);}
.seg.now{background:var(--accent);}
.focus-kind{font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--text3);text-align:center;padding:var(--s2) 0 var(--s1);}
/* Fixed line box: toggling niqqud must never move the layout. */
/* Reserved so nothing jumps when feedback arrives */


/* ── KEYBOARD ────────────────────────────────────────────────
   Proportioned like the system keyboard: a full-bleed tray with a 4px outer
   inset, equal-width letter keys sized off the widest (10-key) row, and the
   8- and 9-key rows centred inside it. Keys sit on the tray as raised
   surfaces with a 1px base, not a glow. The accent appears only on Check.
   Visual keys are ~31px wide, under the 44px guide, so hit areas tile the
   6px gaps the way system keyboards do, and pressing a letter lifts it into
   a callout above the thumb. */
.kbd{touch-action:none;margin:var(--s2) calc(-1 * var(--gutter)) 0;padding:8px 4px calc(6px + env(safe-area-inset-bottom));
  background:var(--surface);border-top:1px solid var(--border);user-select:none;-webkit-user-select:none;}
.kbd-rows{display:flex;flex-direction:column;gap:10px;}
.kbd-row{display:flex;gap:6px;justify-content:center;}
.kbd-key{position:relative;flex:0 0 calc((100% - 54px) / 10);min-width:0;height:46px;
  display:flex;align-items:center;justify-content:center;
  background:var(--surface3);border:none;border-radius:var(--r-sm);box-shadow:0 1px 0 var(--key-shadow);
  font-family:var(--he-font);font-size:22px;font-weight:400;line-height:1;color:var(--text);
  cursor:pointer;touch-action:manipulation;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;}
.kbd-key::after{content:'';position:absolute;inset:-5px -3px;}
.kbd-key:active,.kbd-key.down{background:var(--surface2);}
.kbd-key[data-ch]:active::before,.kbd-key[data-ch].down::before{content:attr(data-ch);position:absolute;left:50%;bottom:calc(100% + 6px);
  transform:translateX(-50%);width:52px;height:56px;display:flex;align-items:center;justify-content:center;
  background:var(--surface3);border:1px solid var(--border);border-radius:var(--r-md);
  font-size:32px;color:var(--text);pointer-events:none;z-index:2;}
/* edge keys: keep the callout on screen */
.kbd-row .kbd-key[data-ch]:first-child:active::before,.kbd-row .kbd-key[data-ch]:first-child.down::before{left:0;transform:none;}
.kbd-row .kbd-key[data-ch]:last-child:active::before,.kbd-row .kbd-key[data-ch]:last-child.down::before{left:auto;right:0;transform:none;}
.kbd-key .klat{display:none;}
.kbd-key.wide{flex:1.4 1 0;background:var(--surface2);color:var(--text2);
  font-family:var(--ui-font);font-size:15px;}
.kbd-key.go{flex:2.2 1 0;background:var(--accent);color:var(--on-accent);font-family:var(--ui-font);
  font-size:15px;font-weight:600;}
.kbd-key.go:disabled{background:var(--surface2);color:var(--text3);}
.kbd-key.go:active,.kbd-key.go.down{background:var(--accent-hi);}


/* ── FOCUS STEP BODIES ───────────────────────────────────────*/
#stepBody{display:grid;grid-template-rows:1fr auto auto auto;min-height:0;}
.fs-prompt{display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:var(--s4);text-align:center;min-height:0;padding:var(--s4) 0;}
.fs-he{font-family:var(--he-font);font-size:42px;font-weight:500;line-height:1.9;
  min-block-size:1.9em;display:flex;align-items:center;color:var(--text);}
.fs-he.sm{font-size:30px;}
.fs-en{font-size:27px;line-height:1.25;color:var(--text);max-width:320px;}
/* italic = how it sounds, roman = what it means. Shape tells you which. */
.fs-translit{font-style:italic;font-size:14px;color:var(--text3);letter-spacing:.01em;}
.fs-note{font-size:13px;color:var(--text3);}
.fs-opts{display:flex;flex-direction:column;gap:var(--s3);padding:var(--s4) 0 var(--s2);}
.fs-opt{min-height:56px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-sm);color:var(--text);font-family:var(--ui-font);font-size:16px;
  padding:14px var(--s4);text-align:start;cursor:pointer;transition:background .1s var(--ease);}
.fs-opt:active:not(:disabled){background:var(--surface2);}
.fs-opt.correct{border-color:var(--green);color:var(--green);}
.fs-opt.wrong{border-color:var(--rose);color:var(--rose);}
.fs-opt .oh{font-family:var(--he-font);font-size:21px;display:block;}
.fs-opt .oe{font-size:12px;color:var(--text3);display:block;margin-top:2px;}
.fs-field{width:100%;min-height:64px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-sm);color:var(--text);font-family:var(--he-font);font-size:30px;
  line-height:1.9;padding:10px 16px;direction:rtl;text-align:right;outline:none;
  transition:border-color .12s var(--ease);}
.fs-field:focus{border-color:var(--accent-ink);}
.fs-field.good{border-color:var(--green);}
.fs-field.bad{border-color:var(--rose);}
.fs-fb{min-height:40px;display:flex;align-items:center;justify-content:center;
  font-size:14px;text-align:center;gap:8px;flex-wrap:wrap;padding:0 4px;}
.fs-fb .was{font-family:var(--he-font);font-size:20px;color:var(--text);}
/* Hebrew underlines must clear the niqqud below the letters */
.fs-fb u{text-decoration-color:var(--rose);text-decoration-thickness:1.5px;text-underline-offset:.3em;}
.fs-row{display:flex;gap:var(--s3);padding:var(--s3) 0 calc(var(--s4) + env(safe-area-inset-bottom));}
.fs-row .btn{flex:1;}
.btn-quiet{flex:1;min-height:44px;background:none;border:1px solid var(--border);
  border-radius:var(--r-sm);color:var(--text2);font-family:var(--ui-font);font-size:15px;cursor:pointer;}
.btn-quiet:active{background:var(--surface);}
.fs-reveal{font-size:13px;color:var(--text3);text-align:center;padding:4px 0;line-height:1.6;}
.fs-reveal b{color:var(--text2);font-weight:400;}


/* Hints never share a colour with actions. */
.pron-btn{border-radius:var(--r-sm);font-weight:600;letter-spacing:.5px;text-transform:uppercase;transition:background .12s var(--ease),border-color .12s var(--ease),color .12s var(--ease);user-select:none;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:6px 12px;background:none;border:none;color:var(--text3);font-family:var(--ui-font);font-size:13px;font-style:italic;cursor:pointer;}
.pron-btn .i{width:17px;height:17px;}
.pron-hidden{display:none;}

/* ── TODAY ───────────────────────────────────────────────────
   The primary action is anchored in the thumb zone, which is also what
   closes the dead gap the old layout left above the tab bar. */
.t-date{display:flex;align-items:center;justify-content:space-between;
  font-size:13px;color:var(--text3);padding:2px 0 14px;}
.t-date .st{display:inline-flex;align-items:center;gap:5px;}
.t-count{font-size:15px;color:var(--text2);padding-bottom:4px;}
.t-count b{color:var(--text);font-weight:400;}
.t-slice-lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--text3);padding-bottom:8px;}
.q-box{font-size:11px;line-height:14px;text-align:center;width:16px;height:16px;border:1px solid var(--border);border-radius:2px;display:flex;align-items:center;justify-content:center;flex:none;}
.q-row.done .q-txt{color:var(--text3);}
.q-txt{flex:1;}
.q-n{font-weight:700;color:var(--text3);font-size:13px;}
.t-cta .btn{width:100%;font-size:16px;min-height:52px;}


/* ── MAP ─────────────────────────────────────────────────────*/
.map-head{padding:var(--s5) 0 var(--s4);}
.map-title{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--text3);}
.map-full{padding:var(--s2) 0 var(--s6);border-bottom:1px solid var(--border);margin-bottom:0;}
.map-full canvas{width:100%;display:block;}
.map-key{display:flex;gap:var(--s4);flex-wrap:wrap;font-size:11px;color:var(--text3);padding-top:var(--s4);}
.map-key span{display:inline-flex;align-items:center;gap:5px;}
.mk{width:8px;height:8px;display:inline-block;}
.lv-row{padding:28px 0;border-bottom:1px solid var(--border);}
.lv-row.cur{border-inline-start:2px solid var(--accent);padding-inline-start:12px;margin-inline-start:-14px;}
.lv-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
.lv-name{font-weight:700;font-size:17px;color:var(--text);}
.lv-rng{font-size:12px;color:var(--text3);}
.lv-sec{font-size:13px;color:var(--text2);padding-top:6px;}
/* Four labelled bars, fixed order. No radar: with four axes the area
   exaggerates differences and the shape depends on axis order. */
.dimbars{display:flex;flex-direction:column;gap:10px;padding:20px 0 var(--s3);}
.dimbar{display:grid;grid-template-columns:76px 1fr 34px;align-items:center;gap:var(--s3);
  font-size:12px;color:var(--text3);}
.dimbar .dt{background:var(--border);height:3px;border-radius:2px;overflow:hidden;}
.dimbar .df{height:100%;background:var(--accent-line);}
.dimbar .dn{text-align:end;}
/* Compact four-slot glyph: R P U C by POSITION, never by hue. */
.dimglyph{display:inline-flex;gap:3px;vertical-align:middle;}
.dg{width:11px;height:11px;border:1px solid var(--border);border-radius:1px;position:relative;}
.dg.half{background:var(--accent-muted);}
.dg.full{background:var(--accent);border-color:var(--accent-ink);}
.dg.sec::after{content:'';position:absolute;left:1px;right:1px;bottom:-3px;height:1px;background:var(--accent-line);}
.cando{line-height:1.45;margin-bottom:5px;display:flex;align-items:center;gap:var(--s3);font-size:14px;color:var(--text2);padding:10px 0;}
.cando.done{color:var(--text3);}
.lv-lock{font-size:12px;color:var(--text3);padding-top:var(--s3);line-height:1.6;}


/* ── CHROME ──────────────────────────────────────────────────*/
.app{position:relative;z-index:1;margin:0 auto;padding-top:10px;max-width:560px;padding:0 var(--gutter) calc(80px + env(safe-area-inset-bottom));}
.compact-head{gap:10px;margin-bottom:0;display:flex;align-items:center;justify-content:space-between;padding:calc(var(--s4) + env(safe-area-inset-top)) 0 var(--s4);}
.ch-title{font-size:15px;letter-spacing:.02em;color:var(--text2);font-weight:400;}
.mini-pill .i{width:15px;height:15px;}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:200;display:flex;background:var(--bg);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom);}
.tabbar button{transition:color .15s;flex:1;background:none;border:none;color:var(--text3);display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 8px;font-size:10px;letter-spacing:.06em;cursor:pointer;min-height:52px;font-family:var(--ui-font);}
.tabbar button .ti{font-size:19px;line-height:1;display:flex;}
.tabbar button .i{width:21px;height:21px;}
.tabbar button.on{color:var(--accent-ink);}

/* ── PRACTICE, organised by the app's own R/P/U/C model ──────*/
.pr-group{padding-top:var(--s6);}
.pr-gl{display:flex;align-items:baseline;gap:8px;font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--text3);padding-bottom:var(--s2);}
.pr-gl .pct{letter-spacing:0;text-transform:none;font-size:12px;}
.pr-item{display:flex;align-items:center;gap:14px;padding:13px 0;
  border-bottom:1px solid var(--border);cursor:pointer;}
.pr-item:active{background:var(--surface);}
.pr-mark{width:30px;height:30px;flex:none;display:flex;align-items:center;justify-content:center;
  font-family:var(--he-font);font-size:19px;color:var(--text3);
  border:1px solid var(--border);border-radius:var(--r-sm);}
.pr-item.on .pr-mark{color:var(--accent-ink);border-color:var(--accent-ink);}
.pr-txt{flex:1;}
.pr-nm{font-size:15px;color:var(--text);}
.pr-ds{font-size:12px;color:var(--text3);padding-top:1px;}
.pr-off{font-size:10px;color:var(--warning);letter-spacing:.08em;text-transform:uppercase;}


/* ── OVERRIDE the pre-redesign card chrome on everything reworked above.
   Hairline rules replace card backgrounds: it is the contrast between a
   tight group and a loose separation that makes a layout look designed. */
.mini-pill{white-space:nowrap;display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--text3);background:none;border:none;border-radius:0;padding:0;}
.q-row{margin-bottom:0;display:flex;align-items:center;gap:12px;padding:var(--s4) 0;font-size:15px;background:none;border:none;border-bottom:1px solid var(--border);border-radius:0;}
.q-row:first-child{border-top:1px solid var(--border);}
.q-row.done .q-box{background:none;border-color:var(--green);color:var(--green);}
.qlist{margin-bottom:6px;display:flex;flex-direction:column;gap:0;}
.quiz-card{background:none;border:none;border-radius:0;padding:0;}
.stats-bar{display:flex;margin-bottom:18px;flex-wrap:wrap;align-items:center;gap:10px;}
.stat-pill{display:flex;align-items:center;gap:6px;font-weight:500;background:none;border:none;border-radius:0;padding:0;font-size:13px;color:var(--text3);}
.stat-pill .num{font-weight:700;font-size:15px;color:var(--text);}
.selector-bar{display:flex;margin-bottom:10px;flex-wrap:wrap;gap:8px;}
.sel-btn{flex:1;min-width:130px;padding:9px 15px;cursor:pointer;font-family:var(--ui-font);display:flex;align-items:center;justify-content:space-between;gap:8px;transition:background .12s var(--ease),border-color .12s var(--ease),color .12s var(--ease);background:var(--surface);border:none;border-radius:var(--r-sm);min-height:52px;}
.toggle-btn,.analytics-btn{background:none;border:1px solid var(--border);
  border-radius:var(--r-sm);color:var(--text2);}
.toggle-btn.on{background:var(--accent-muted);border-color:var(--accent-ink);color:var(--accent-ink);}
.mode-grid{grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:16px;display:block;}
.big-btn{display:block;width:100%;padding:18px;font-size:17px;cursor:pointer;margin-top:18px;background:var(--accent);color:var(--on-accent);border:none;border-radius:var(--r-sm);min-height:52px;font-family:var(--ui-font);font-weight:600;}
.today-hero .th-n{font-size:58px;font-weight:900;line-height:1;color:var(--accent-ink);}
.sel-cap{font-size:9px;text-transform:uppercase;color:var(--text3);letter-spacing:.12em;}
.streak-badge{border-radius:var(--r-sm);font-size:12px;font-weight:600;background:none;border:none;color:var(--text3);padding:0;}


/* The journey takes the slack, so the space above the thumb-zone action is
   the map rather than nothing. */

/* ── PRACTICE: content leads ─────────────────────────────────
   The old stack put 6 stat pills, 2 buttons and 3 dropdowns above the
   question. Stats live on Me; the mode list IS the picker; category and
   level collapse into one quiet filter row. */
#viewPractice .stats-bar{display:none;}
#viewPractice .selector-bar{display:none;}
#viewPractice #panelMode{display:block!important;max-height:none;overflow:visible;
  background:none;border:none;padding:0;margin:0;opacity:1;}
.pr-nm,.pr-ds{display:block;}
.pr-filters{display:flex;gap:var(--s3);padding:var(--s2) 0;}
.pr-filters button{flex:1;min-height:44px;background:none;border:1px solid var(--border);
  border-radius:var(--r-sm);color:var(--text2);font-family:var(--ui-font);font-size:13px;
  display:flex;flex-direction:column;align-items:flex-start;justify-content:center;
  padding:6px 12px;cursor:pointer;}
.pr-filters .fl{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);}
.pr-filters .fv{color:var(--text);font-size:14px;}
/* ── PRACTICE IN FOCUS ───────────────────────────────────────
   A mode opens as the same full-screen layer as a round step, not as a card
   underneath the 13-mode list. Modes built from the shared step bodies
   (.fsq) get the round's no-scroll grid; reference-style modes (grammar
   tables, aleph-bet, Sicha) scroll inside the layer. */
#viewPractice .quiz-card{display:none;}
body.pfocus #viewPractice .quiz-card{position:fixed;inset:0;z-index:150;display:grid;
  grid-template-rows:auto minmax(0,1fr);justify-content:normal;align-content:normal;
  height:100dvh;min-height:0;margin:0;border:0;border-radius:0;overflow:hidden;
  padding:env(safe-area-inset-top) 0 0;background:var(--bg);}
.pr-strip{display:none;}
body.pfocus .pr-strip{display:flex;padding-inline:var(--gutter);}
.pr-ttl{flex:1;text-align:center;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--text3);}
.pr-strip::after{content:'';flex:none;width:34px;}  /* balances the close button so the title centres */
body.pfocus #quizContent{min-height:0;overflow-y:auto;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;padding:var(--s2) var(--gutter) calc(var(--s5) + env(safe-area-inset-bottom));}
/* side padding lives HERE, not on the card: overflow clips at the padding
   edge, so the keyboard's -16px full-bleed margin stays visible */
/* short content sits optically centred; the spacers collapse to nothing
   once content is taller than the layer, so scrolling still starts at the top */
body.pfocus #quizContent:not(.fsq){display:flex;flex-direction:column;}
body.pfocus #quizContent:not(.fsq)>*{flex-shrink:0;}
body.pfocus #quizContent:not(.fsq)::before{content:'';flex:1 1 0;max-height:12vh;}
body.pfocus #quizContent:not(.fsq)::after{content:'';flex:2 1 0;}
body.pfocus #quizContent.fsq{display:grid;grid-template-rows:1fr auto auto auto;overflow:hidden;padding:0 var(--gutter);}


.t-slice canvas{width:100%;display:block;flex:none;margin:0;}
/* Pinned above the tab bar: the action is always one thumb-reach away,
   whatever the content length. */

/* Full-height column so the action sits in the thumb zone whatever the
   content length, with the journey breathing above it. */
.today-grid{gap:0;grid-template-rows:auto auto 1fr auto auto;min-height:0;display:flex;flex-direction:column;/* viewport minus the compact header (59) and the tab-bar allowance the
     .app already reserves (76), so the action lands just above the bar. */
  min-height:calc(100dvh - 59px - 80px - env(safe-area-inset-top) - env(safe-area-inset-bottom));}
.t-cta{bottom:0;background:var(--bg);margin-top:auto;position:static;box-shadow:none;padding:20px 0 6px;}
.t-slice{flex-direction:column;min-height:0;justify-content:center;display:block;padding:14px 0 22px;}

/* ── OVERLAYS brought into Ledger ────────────────────────────
   These are full screens, so they follow the same rules: no accent
   headline competing with content, hairlines instead of card stacks,
   one accent per screen reserved for the action. */
.test-inner{position:relative;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;max-width:560px;padding:calc(var(--s5) + env(safe-area-inset-top)) var(--gutter) calc(var(--s7) + env(safe-area-inset-bottom));}
.sch-sec-lbl{margin:16px 0 8px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--text3);padding:40px 0 var(--s3);}
.test-chip{padding:13px 18px;min-height:44px;cursor:pointer;font-family:var(--ui-font);transition:background .12s var(--ease),border-color .12s var(--ease),color .12s var(--ease);flex:1;text-align:center;min-width:78px;border:1px solid var(--border);border-radius:var(--r-sm);font-weight:400;font-size:15px;color:var(--text2);background:none;}
.test-chip.sel{border-color:var(--accent-ink);background:var(--accent-muted);color:var(--text);}
.test-chip .tc-sub{display:block;font-weight:400;margin-top:3px;color:var(--text3);font-size:11px;}
.test-chip.sel .tc-sub{color:var(--text2);}
.test-x{padding:8px 16px;min-height:40px;display:inline-flex;align-items:center;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--ui-font);transition:background .12s var(--ease),border-color .12s var(--ease),color .12s var(--ease);border:1px solid var(--border);background:none;color:var(--text2);border-radius:var(--r-sm);}
.analytics-panel{width:100%;overflow-y:auto;position:relative;background:var(--bg);border:none;border-radius:0;max-width:560px;padding:calc(var(--s5) + env(safe-area-inset-top)) var(--gutter) calc(var(--s7) + env(safe-area-inset-bottom));max-height:100dvh;}
.analytics-overlay{display:none;position:fixed;inset:0;z-index:300;align-items:center;justify-content:center;padding:20px;background:var(--bg);}
.an-title{margin-bottom:var(--s2);font-family:var(--ui-font);font-size:22px;font-weight:400;color:var(--text);}
.an-sub{margin-bottom:var(--s6);font-size:13px;color:var(--text3);}
.an-close{position:absolute;top:16px;right:18px;font-size:22px;cursor:pointer;background:none;border:1px solid var(--border);border-radius:var(--r-sm);color:var(--text2);min-height:40px;min-width:44px;display:inline-flex;align-items:center;justify-content:center;}
.atab{padding:5px 16px;font-size:12px;cursor:pointer;font-weight:500;font-family:var(--ui-font);transition:background .12s var(--ease),border-color .12s var(--ease),color .12s var(--ease);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--text3);background:none;}
.atab.active{border-color:var(--accent-ink);color:var(--text);background:var(--accent-muted);}
.conv-result{margin-top:10px;padding:11px 15px;font-size:13px;line-height:1.6;border-radius:var(--r-sm);}
.conv-result.good{background:none;border:none;border-left:2px solid var(--green);
  padding-left:12px;color:var(--text2);}
.conv-result.bad{background:none;border:none;border-left:2px solid var(--rose);
  padding-left:12px;color:var(--text2);}
.sch-task{flex:1;min-width:220px;background:none;border:none;border-left:2px solid var(--border);border-radius:0;padding:4px 0 4px 12px;}
.sch-task-title{font-size:15px;color:var(--text);margin-bottom:3px;font-weight:400;}
.sch-task-lbl{font-size:10px;text-transform:uppercase;margin-bottom:4px;letter-spacing:.16em;color:var(--text3);}
.empty-state{text-align:center;padding:32px;font-size:14px;color:var(--text3);}
.toast{position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:50%;transform:translateX(-50%) translateY(-80px);background:var(--surface2);border-radius:var(--r-sm);padding:11px 22px;font-size:14px;border:1px solid var(--border);transition:transform .2s var(--ease);z-index:200;pointer-events:none;font-weight:400;font-family:var(--ui-font);}
.bar-track{flex:1;height:8px;border-radius:4px;overflow:hidden;background:var(--border);}
.bar-bad{height:100%;border-radius:4px;transition:width .28s var(--ease);background:var(--rose);}
.bar-lbl{font-size:16px;direction:rtl;color:var(--text);min-width:70px;text-align:right;font-family:var(--he-font);}


/* ── ROUND SUMMARY ───────────────────────────────────────────*/
.done-wrap{display:flex;flex-direction:column;align-items:center;
  text-align:center;gap:6px;
  min-height:calc(100dvh - 59px - 80px - env(safe-area-inset-top) - env(safe-area-inset-bottom));}
.done-n{font-size:56px;color:var(--text);line-height:1;}
.done-l{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--text3);}
.done-sub{font-size:14px;color:var(--text2);padding-top:6px;}
.done-dims{display:flex;align-items:center;gap:10px;padding:22px 0 4px;}
.dg-lbl{font-size:11px;letter-spacing:.12em;color:var(--text3);}
.done-mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;}
.done-actions{display:flex;flex-direction:column;gap:var(--s3);width:100%;max-width:320px;padding-bottom:10px;}
.done-actions .btn,.done-actions .btn-quiet{width:100%;}
/* Long lists: content-visibility beats hand-rolled virtualisation at this
   scale and keeps the file dependency-free. */
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;content-visibility:auto;contain-intrinsic-size:auto 56px;}


/* ── ME ──────────────────────────────────────────────────────*/
.me-row{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 0;border-bottom:1px solid var(--border);font-size:15px;color:var(--text2);}
.me-row .num{color:var(--text);}
.me-row.link{cursor:pointer;color:var(--text);}
.me-row.link:active{background:var(--surface);}
.me-tog{min-height:36px;padding:6px 14px;background:none;border:1px solid var(--border);
  border-radius:var(--r-sm);color:var(--text2);font-family:var(--ui-font);font-size:13px;cursor:pointer;}
.me-tog.on{border-color:var(--accent-ink);color:var(--accent-ink);background:var(--accent-muted);}


.empty-line{font-size:14px;color:var(--text3);text-align:center;padding:10px 0 14px;}
.t-cta .btn-quiet{width:100%;}
/* Sicha offline: name what still works rather than just failing. */
.offline-note{display:flex;align-items:flex-start;gap:10px;font-size:14px;
  color:var(--text2);border-left:2px solid var(--warning);padding:4px 0 4px 12px;line-height:1.6;}


/* One accent per screen, and it belongs to the action — not the headline. */
.test-setup-title{text-align:center;margin-bottom:4px;font-family:var(--ui-font);font-size:26px;font-weight:400;color:var(--text);}
.test-setup-sub{text-align:center;margin-bottom:30px;font-size:13px;color:var(--text3);}
.th-logo{font-size:18px;}
.sch-head .sch-gloss-btn,.sch-add{border-radius:var(--r-sm);}


/* ── LABELLED HEADER STATS ───────────────────────────────────
   Words, not icon + bare number. Zero values are omitted, so a first run
   shows no stats at all rather than a row of zeros. */
.h-stats{font-size:13px;font-variant-caps:all-small-caps;letter-spacing:.06em;color:var(--text2);
  font-variant-numeric:tabular-nums lining-nums;white-space:nowrap;}
.h-stats:empty{display:none;}

/* ── TODAY ───────────────────────────────────────────────────
   Level progress is a labelled bar (secure over met), filled by scaleX and
   read right-to-left like the map. The slack above Start holds the words
   the next round will introduce, so the screen is never empty space. */
.t-lv{padding:18px 0 20px;}
.t-lv-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;}
.t-lv-name{font-size:20px;color:var(--text);}
.t-lv-name span{color:var(--text3);}
.t-lv-n{font-size:13px;color:var(--text3);}
.t-bar{position:relative;height:8px;margin-top:var(--s3);background:var(--surface2);
  border-radius:var(--r-sm);overflow:hidden;}
.t-bar i{position:absolute;inset:0;transform-origin:right;}
.t-bar .met{background:var(--lv3);}
.t-bar .sec{background:var(--text2);}
.t-lv-key{display:flex;gap:20px;padding-top:var(--s3);font-size:12px;color:var(--text3);}
.t-lv-key span{display:inline-flex;align-items:center;gap:6px;}
.t-lv-key i{width:8px;height:8px;border-radius:1px;display:inline-block;}
.t-next{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:22px 0 0;}
.t-next-lbl{font-size:13px;font-variant-caps:all-small-caps;letter-spacing:.06em;color:var(--text3);padding-bottom:var(--s3);}
.t-next-row{display:flex;align-items:center;justify-content:space-between;gap:16px;
  border-bottom:1px solid var(--border);padding:6px 0;min-height:56px;}
.t-next-he{font-family:var(--he-font);font-size:22px;line-height:1.9;color:var(--text);}
body.cursive-on .t-next-he{font-family:var(--he-cursive);}
.t-next-en{font-size:14px;color:var(--text3);}
.t-next-sum{font-size:15px;color:var(--text2);}

/* ── NEW WORD ────────────────────────────────────────────────
   The word is the hero; gloss, then the example with the word in place.
   Nothing small is stranded at the bottom of the screen. */
.fs-prompt.intro{padding-bottom:6vh;gap:6px;}
.fs-he.hero{font-size:60px;font-weight:500;}
.fs-he.hero.long{font-size:44px;}
.fs-he.hero.xlong{font-size:34px;}
.intro-gloss{font-size:21px;color:var(--text);line-height:1.3;padding-top:6px;}
.intro-ex{margin-top:26px;padding-top:18px;border-top:1px solid var(--border);width:100%;max-width:320px;}
.intro-ex .exh{font-family:var(--he-font);font-size:22px;line-height:1.9;color:var(--text2);}
body.cursive-on .intro-ex .exh{font-family:var(--he-cursive);}
.intro-ex .exe{font-size:15px;color:var(--text3);line-height:1.45;}
.intro-ex b{font-weight:inherit;color:var(--text);}
.intro-ex .gap{display:inline-block;width:2.2em;border-bottom:1px solid var(--text3);vertical-align:.1em;}

/* ── PRACTICE ROWS ───────────────────────────────────────────*/
.pr-item{min-height:64px;padding:var(--s4) 0;gap:var(--s4);}
.pr-mark{width:32px;height:32px;border:none;color:var(--text3);}
.pr-mark .i{width:22px;height:22px;}
.pr-item.on .pr-mark{color:var(--accent-ink);}
.pr-nm{font-size:17px;}
.pr-ds{font-size:13px;}
.pr-gl .pct.weak{color:var(--text2);font-style:italic;}


/* ── ME: iOS inset grouped lists ─────────────────────────────
   Grouped rows on one surface with inset hairlines; headers are running
   heads, not chips. Real switches for binary settings. */
.me-id{padding:var(--s5) 0 var(--s2);}
.me-big{font-size:24px;color:var(--text);line-height:1.25;}
.me-of{font-size:17px;color:var(--text2);}
.me-sub{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--text3);padding-top:6px;line-height:1.5;}
.me-legend{display:flex;flex-direction:column;gap:10px;padding-top:14px;}
.me-legend-b .me-legend{padding:14px 16px;}
.ml-row{display:flex;gap:12px;font-size:14px;color:var(--text3);line-height:1.45;}
.ml-row b{font-weight:400;color:var(--text);}
.ml-k{flex:none;width:22px;height:22px;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--border);border-radius:var(--r-sm);font-size:12px;color:var(--text2);
  font-variant-numeric:tabular-nums;}
.group{margin-top:var(--s6);}
.group-h{margin:0 0 10px var(--s4);font-size:13px;font-weight:400;font-variant-caps:all-small-caps;
  letter-spacing:.06em;color:var(--text3);}
.group-b{background:var(--surface);border-radius:var(--r-md);overflow:hidden;}
.group-f{margin:8px 16px 0;font-size:13px;line-height:1.45;color:var(--text3);}
.group-b .row{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:52px;
  padding:14px var(--s4);font:400 16px/1.3 var(--ui-font);color:var(--text);background:none;border:0;
  text-align:start;cursor:pointer;}
.group-b .row>span:first-child{flex:1;}
.group-b .row+.row::before{content:'';position:absolute;top:0;inset-inline:16px 0;border-top:1px solid var(--border);}
.group-b .row:active{background:var(--surface2);}
.row-meta{color:var(--text3);}
.row-chev{width:18px;height:18px;color:var(--text3);transform:rotate(-90deg);flex:none;}
.row.danger{color:var(--rose);}

/* Native-proportioned switch: 51×31 track, 27px thumb, hit area ≥44px.
   The ONE exception to the two-radii rule: a switch is recognised by its
   rounded shape, and a square toggle reads as a checkbox. Dark thumb on
   the accent fill when on — the Ledger signature carried into the control. */
.switch{appearance:none;-webkit-appearance:none;position:relative;flex:none;width:51px;height:31px;margin:0;
  border-radius:16px;background:var(--surface3);cursor:pointer;
  transition:background-color .2s var(--ease);}
.switch::before{content:'';position:absolute;inset:-7px -4px;}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;
  background:var(--text2);box-shadow:0 1px 2px var(--thumb-shadow);
  transition:transform .2s var(--ease),background-color .2s var(--ease);}
.switch:checked{background:var(--accent);}
.switch:checked::after{transform:translateX(20px);background:var(--on-accent);}
.switch:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px;}

.map-cap{font-size:14px;color:var(--text2);line-height:1.5;padding-top:8px;}

.t-first{display:block;font-size:24px;color:var(--text);line-height:1.25;padding-top:4px;}
.t-first-sub{display:block;font-size:15px;color:var(--text2);line-height:1.5;padding-top:6px;}

/* a quest with nothing to do today: neither pending nor done */
.q-row.idle .q-txt,.q-row.idle .q-n{color:var(--text3);}
.q-row.idle .q-box{border-style:dashed;}


/* ── MOTION ──────────────────────────────────────────────────
   Entrance-only: new content settles in, and NOTHING waits for an
   animation to finish, so no setting (Reduce Motion, Low Power, a
   backgrounded tab) can stall a round. Transform and opacity only, all
   under 300ms, one house curve. No bounce, no shake, no count-ups. The
   keyboard never animates — it is touched hundreds of times a day. */
:root{--d-press:80ms;--d-step:200ms;--d-screen:280ms;--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;--gutter:20px;}
@keyframes step-in{from{opacity:0;transform:translateY(6px);}}
@keyframes fb-in{from{opacity:0;transform:translateY(4px);}}
@keyframes fade-out{to{opacity:0;}}
/* a new step / question */
#stepBody>:not(.kbd),
body.pfocus #quizContent.fsq>:not(.kbd),
body.pfocus #quizContent:not(.fsq):not([data-mode="sicha"]):not([data-mode="conversation"])>*{
  animation:step-in var(--d-step) var(--ease) both;}
/* feedback arrives beside the answer, never as a flash */
.fs-fb>*{animation:fb-in var(--d-step) var(--ease) both;}
/* the Practice layer itself appears solid and instantly (anything that moves
   or fades would show the list behind it); its content gets the step entrance */
/* press states: instant on press, 80ms release, no lift and no glow */
.btn,.btn-quiet,.fs-opt,.big-btn{transition:transform var(--d-press) var(--ease),
  background-color var(--d-press) var(--ease),border-color .12s var(--ease),color .12s var(--ease);}
.btn:active,.btn-quiet:active,.big-btn:active,.fs-opt:active:not(:disabled){transform:scale(.98);transition:none;}
.tabbar button{transition:opacity var(--d-press) var(--ease);}
.tabbar button:active{opacity:.55;transition:none;}
/* tab changes: View Transitions (Safari 18+), progressive. The tab bar and
   header are named so they stay put while the screen between them changes. */
::view-transition-old(root){animation:140ms var(--ease) both fade-out;}
::view-transition-new(root){animation:var(--d-screen) var(--ease) both step-in;}
.tabbar{view-transition-name:tabbar;}
.app>.compact-head{view-transition-name:apphead;}
/* `*` does not reach the view-transition pseudo-elements, so they get their
   own reduced-motion rule (JS also skips the transition entirely). */
@media (prefers-reduced-motion:reduce){
  ::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important;}
}

/* status-bar band (paper only; zero height without a notch) */
body::before{content:'';position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);
  background:var(--status-band);z-index:1000;pointer-events:none;}
/* segmented control: Dark · Paper · Auto */
.segc{display:inline-flex;flex:none;border:1px solid var(--border);border-radius:var(--r-sm);}
.segc button{min-height:44px;padding:4px 13px;border:0;background:none;color:var(--text2);
  font:400 14px/1 var(--ui-font);cursor:pointer;}
.segc button:first-child{border-radius:var(--r-sm) 0 0 var(--r-sm);}
.segc button:last-child{border-radius:0 var(--r-sm) var(--r-sm) 0;}
.segc button+button{border-inline-start:1px solid var(--border);}
/* selected = tint AND an ink rule, so it never relies on the tint alone */
.segc button.on{background:var(--accent-muted);color:var(--text);box-shadow:inset 0 -2px 0 var(--accent-ink);}
.group-b .segc-row{cursor:default;padding-block:6px;}
.group-b .segc-row:active{background:none;}

::placeholder{color:var(--text3);opacity:1;}

/* ── TODAY, simplified: progress · what's next · one button ── */
.today-grid .t-lv{padding:var(--s5) 0 0;}
.today-grid .t-next{flex:1;justify-content:center;padding:var(--s6) 0;}
.t-next-note{font-size:13px;color:var(--text3);padding-top:var(--s2);}
.today-grid .t-cta{padding:var(--s4) 0 var(--s5);}
.today-grid .t-cta .btn{min-height:60px;font-size:18px;}
.today-grid .t-next-he{font-size:26px;}
.today-grid .t-next-en{font-size:15px;}

/* A Practice layer covers the list; the list itself must not reflow underneath
   it (focus mode zeroes .app padding for the round, which lives inside .app). */
body.focus.pfocus .app{max-width:560px;margin:0 auto;padding:0 var(--gutter) calc(80px + env(safe-area-inset-bottom));}

/* Short screens (iPhone SE, 667pt): the same scale one step tighter, so a
   question never clips at the bottom. Normal-height iPhones keep full room. */
@media (max-height:700px){
  .fs-prompt{padding:var(--s2) 0;gap:var(--s3);}
  .fs-opts{gap:var(--s2);padding:var(--s3) 0 var(--s1);}
  .fs-opt{min-height:52px;padding:12px var(--s4);}
  .fs-fb{min-height:32px;}
}

// existing categories stand in for one — imperfect but good enough, and it

// ── LEXICAL ANNOTATIONS ───────────────────────────────────────
// data/annotations.json: part of speech, gender, plural, root, binyan,
// derived from Wiktionary. Loaded async and allowed to be absent — the
// category heuristics below stay as a fallback so nothing breaks offline
// or on a first load.
var ANN={};
function loadAnnotations(){
  return fetch('data/annotations.json')
    .then(function(r){ return r.ok?r.json():{}; })
    .then(function(d){ ANN=d||{}; _fam=null; return ANN; })
    .catch(function(){ return {}; });
}

const NOUNISH={'Food':1,'Things':1,'Places':1,'House':1,'Body':1,'Animals':1,
  'Nouns':1,'People':1,'Family':1,'Nature':1,'School':1,'Work':1,'Travel':1,
  'Shopping':1,'Wine':1,'Fashion':1,'Health':1,'Jewish Life':1,'Getting Around':1};
// Categories stand in for parts of speech, and they leak: adjectives and
// adverbs are filed under Food, Adjectives holds adverbs. Without a `pos`
// field on 1,391 words these blocklists are the cheap correction.
const NOT_NOUN={'טעים':1,'חריף':1,'מתוק':1,'מלוח':1,'חם':1,'קר':1,'טרי':1,'בריא':1,
  'רעב':1,'צמא':1,'מלא':1,'ריק':1,'זול':1,'יקר':1,
  'קדימה':1,'אחורה':1,'מעל':1,'מתחת':1,'למעלה':1,'למטה':1,'בפנים':1,'בחוץ':1,
  'ישר':1,'ימינה':1,'שמאלה':1,'ליד':1,'קרוב':1,'רחוק':1,'כאן':1,'פה':1,'שם':1};
const NOT_ADJ={'קצת':1,'מאוד':1,'בהחלט':1,'כל':1,'מספיק':1,'אולי':1,'בדיוק':1,
  'הרבה':1,'יותר':1,'פחות':1,'ממש':1,'תמיד':1,'אפשר':1,'כמעט':1};
// An infinitive is not "starts with ל" — that also catches לומד and לוקחת.
// Every infinitive in this dataset is glossed "to …", which is a clean test.
function isInfinitive(w){ return w.cat==='Verbs'&&w.he.charAt(0)==='ל'&&w.en.indexOf('to ')===0; }
function patternFillers(p){
  var all=vocab.filter(function(w){
    if(w.he.indexOf(' ')>-1) return false;            // single words only
    if(w.level>p.level+2) return false;               // stay near the level
    var pos=posOf(w);
    if(p.slot==='infinitive') return isInfinitive(w);
    // Annotated POS beats the category heuristic: categories leak badly
    // (adjectives filed under Food, adverbs under Adjectives).
    // Hebrew present participles double as adjectives (כועס "angry/angers",
    // רועש "noisy/makes noise"). Wiktionary files them as verbs, so an
    // adjective slot accepts a participle the app itself calls an adjective.
    if(p.slot==='adj'){
      if(pos==='adj') return true;
      if(pos==='verb') return w.cat==='Adjectives'&&w.en.indexOf('to ')!==0;
      return pos?false:(w.cat==='Adjectives'&&!NOT_ADJ[w.he]);
    }
    if(pos)             return pos==='noun';
    return !!NOUNISH[w.cat]&&!NOT_NOUN[w.he];
  });
  // A slot being grammatically fillable does not make the sentence sensible:
  // "I want man" is valid Hebrew and useless practice. Prefer the categories
  // that actually belong in this frame, and only widen if too few qualify.
  if(p.pref){
    var good=all.filter(function(w){return p.pref.indexOf(w.cat)>-1;});
    if(good.length>=6) return good;
  }
  return all;
}

// These are design judgments, NOT sourced cut-offs. They are collected in one
// place so the pending research run can retune them without touching logic.
const CFG={
  newPerDay: 7,            // 2 scheduled cards per word; 7/day ≈ 20 min/day
  secureDays: 7,           // Produce stability before a word counts as Secure
  masteredDays: 21,
  gate:{ breadth:0.85, patterns:0.80, checkpoint:0.85, softUnlock:0.70 },
  // The doc's "no dimension below 70%" hard gate is deliberately NOT enforced
  // yet — four ways to be blocked risks deadlock. Surfaced as a shape chart
  // first; revisit once there is real data.
