};

// ── DIMENSIONS ────────────────────────────────────────────────
// A level is a bundle of competencies, not a word list. Each item carries a
// profile across dimensions rather than one mastery flag.
//   R  Recognize — see Hebrew, retrieve meaning
//   P  Produce   — generate Hebrew from meaning, typed   (the real gate)
//   U  Use       — deploy correctly inside a sentence pattern
//   C  Connect   — link to root and relatives
// Only R and P schedule cards on words. U belongs to the pattern and C to the
// root, as items in their own right, rather than being duplicated onto every
// word — which is what keeps the review load survivable.
const DIMS={R:'Recognize',P:'Produce',U:'Use',C:'Connect'};

function itemWord(he){ return 'w:'+he; }
function itemPattern(id){ return 'p:'+id; }
function itemRoot(r){ return 'r:'+r; }

function getCard(id,dim){
  var k=id+'|'+dim;
  return ST.cards[k]||{n:0,due:0,reps:0,lapses:0};
}
// Interval ladder, kept deliberately swappable: FSRS drops in here once its
// parameters can be verified rather than recalled.
function srsInt(l){ return [0,60000,300000,1800000,864e5,6048e5][Math.min(l,5)]; }
// grade: true|'good' advances, 'hard' holds the rung, false|'again' drops it.
function schedule(c,grade){
  var n;
  if(grade===false||grade==='again') n=Math.max(c.n-1,0);
  else if(grade==='hard')            n=Math.max(c.n,1);
  else                               n=Math.min(c.n+1,5);
  var bad=(grade===false||grade==='again');
  return {n:n,due:Date.now()+srsInt(n),reps:(c.reps||0)+1,
          lapses:(c.lapses||0)+(bad?1:0)};
}
function reviewItem(id,dim,grade){
  var was=getCard(id,dim);
  if((dim==='R'||dim==='P') && was.reps>0 && was.due<=Date.now()) questReviewed();
  var nc=schedule(was,grade);
  ST.cards[id+'|'+dim]=nc;
  return nc;
}
function cardDue(id,dim){ return getCard(id,dim).due<=Date.now(); }
// Days of stability the card's current rung represents.
function stabilityDays(id,dim){ return srsInt(getCard(id,dim).n)/864e5; }

// A word is Secure on PRODUCTION evidence that survived spaced intervals —
// not on recognition streaks, which multiple choice inflates by guessing.
function wordState(he){
  var id=itemWord(he), p=getCard(id,'P'), r=getCard(id,'R');
  var pd=srsInt(p.n)/864e5;
  if(pd>=CFG.masteredDays&&p.lapses<=1) return 'mastered';
  if(pd>=CFG.secureDays&&p.reps>=2) return 'secure';
  if(srsInt(r.n)/864e5>=2) return 'familiar';
  if(r.reps||p.reps) return 'learning';
  return 'new';
}
// Per-level shape across dimensions — the chart that makes a lagging
// dimension visible instead of letting 2,000 words hide an inability to speak.
function levelShape(lv){
  var ws=vocab.filter(function(w){return w.level===lv;});
  var out={};
  ['R','P'].forEach(function(d){
    var n=ws.filter(function(w){return getCard(itemWord(w.he),d).reps>0;}).length;
    out[d]=ws.length?Math.round(100*n/ws.length):0;
  });
  var ps=PATTERNS.filter(function(p){return p.level===lv;});
  // null, not 0: a level with no patterns authored yet has no Use score to show.
  out.U=ps.length?Math.round(100*ps.filter(function(p){return getCard(itemPattern(p.id),'U').reps>0;}).length/ps.length):null;
  var fams=Object.keys(rootFamilies()).filter(function(r){
    return (rootFamilies()[r]||[]).some(function(w){ return w.level===lv; });
  });
  out.C=fams.length?Math.round(100*fams.filter(function(r){return getCard(itemRoot(r),'C').reps>0;}).length/fams.length):null;
  out.secure=ws.length?Math.round(100*ws.filter(function(w){
    var s=wordState(w.he); return s==='secure'||s==='mastered';}).length/ws.length):0;
  return out;
}

// ── FILTERING ────────────────────────────────────────────────
function filteredVocab(){
  var base=vocab;
  // Debrief → "practice these now" pins the pool to specific words.
  if(ST.focusList&&ST.focusList.length){
    var fl=vocab.filter(function(w){return ST.focusList.indexOf(w.he)>-1;});
    if(fl.length) return fl;
  }
  if(ST.missedMode){ var m=vocab.filter(function(w){var s=ST.wordStats[w.he];return s&&s.w>0;}); if(m.length) base=m; }
  else if(ST.cat!=='All') base=vocab.filter(function(v){return v.cat===ST.cat;});
  // Narrow by level ONLY if that produces a non-empty set; otherwise keep the
  // category set (never fall back to the whole vocab, which leaks other categories).
  if(ST.level>0){
    var lv=base.filter(function(v){return (v.level||2)===ST.level;});
    if(lv.length) base=lv;
  }
  return base.length?base:vocab;
}
function getDue(){
  var now=Date.now(); var f=filteredVocab();
  var due=f.filter(function(w){var s=ST.srs[w.he]||{level:0,nextAt:0};return s.nextAt<=now;});
  return due.length?due:f;
}
function randWord(ex){
  var pool=getDue().filter(function(w){return w!==ex;});
  if(!pool.length) pool=getDue();
  // adaptive: half the time, draw from words answered wrong more than right
  var weak=pool.filter(function(w){var s=ST.wordStats[w.he];return s&&s.w>s.c;});
  if(weak.length&&Math.random()<.5) pool=weak;
  return pool[Math.floor(Math.random()*pool.length)]||getDue()[0];
}

function renderModes(){

  // Lead with the weakest dimension, so the obvious next tap is the useful one.
  var weakest=order.filter(function(d){return sh[d]!==null;})
    .sort(function(a,b){return sh[a]-sh[b];})[0];
  order.forEach(function(d){
    var ms=MODES.filter(function(m){return MODE_DIM[m.id]===d;});
    if(!ms.length) return;
    h+='<div class="pr-group"><div class="pr-gl"><span>'+DIMS[d]+'</span>'+

    ms.forEach(function(m){

    html+='<button class="fs-opt" id="mco'+i+'" lang="en" dir="ltr" onclick="checkMC('+i+','+(o===w)+')">'+esc(o.en)+'</button>';

function checkMC(i,correct){
  if(ST.answered)return; ST.answered=true; ST.total++;
  reviewItem(itemWord(ST.cur.he),'R',correct);
  trackW(ST.cur.he,correct);
  var btns=document.querySelectorAll('.fs-opt,.mc-opt');
  btns.forEach(function(b){b.disabled=true;});
  if(btns[i]) btns[i].classList.add(correct?'correct':'wrong');
  if(!correct) btns.forEach(function(b){if(b.textContent.trim()===ST.cur.en)b.classList.add('correct');});
  if(correct){ST.correct++;ST.score+=10+ST.streak;ST.streak++;ST.learned.add(ST.cur.he);}
  else{ST.streak=0;}
  var fb=document.getElementById('mcfb');
  if(fb) fb.innerHTML=afterReveal(ST.cur);
  updateStats();setTimeout(function(){advance(correct);},correct?1100:2400);
}

// ── KEY INPUT ────────────────────────────────────────────────
// iOS only synthesises `click` for a clean single tap. A key pressed while
// another thumb was still down, or with the slightest slide, produced NO
// click — dropped letters when typing at speed — and every click arrived only
// after the finger lifted. Keys now act on pointerdown, per finger, like a
// system keyboard; the click that may follow is swallowed so nothing types
// twice. A mouse keeps plain click (desktop is secondary).
var _kbDown={}, _kbPtrAt=0, _bsRepeat=null;
function _kbKey(t){ return t&&t.closest?t.closest('.kbd-key'):null; }
document.addEventListener('pointerdown',function(e){
  if(e.pointerType==='mouse') return;
  var k=_kbKey(e.target); if(!k||k.disabled) return;
  e.preventDefault();                       // no focus shift, selection or zoom
  _kbPtrAt=Date.now();
  _kbDown[e.pointerId]=k; k.classList.add('down');
  if(typeof k.onclick==='function') k.onclick.call(k,e);
  if(k.getAttribute('aria-label')==='Backspace'){          // hold to repeat
    clearTimeout(_bsRepeat);
    _bsRepeat=setTimeout(function rep(){ kbBack(); _bsRepeat=setTimeout(rep,70); },450);
  }
},{passive:false});
function _kbUp(e){
  var k=_kbDown[e.pointerId]; if(k){ k.classList.remove('down'); delete _kbDown[e.pointerId]; }
  if(!Object.keys(_kbDown).length){ clearTimeout(_bsRepeat); _bsRepeat=null; }
}
document.addEventListener('pointerup',_kbUp);
document.addEventListener('pointercancel',_kbUp);
document.addEventListener('click',function(e){
  if(_kbKey(e.target) && Date.now()-_kbPtrAt<800){ e.stopPropagation(); e.preventDefault(); }
},true);
function kbClear(){var i=document.getElementById('ti');if(!i||ST.answered)return;i.value='';kbSyncGo();}

function renderShorashQuiz(){
  _shMode='quiz'; _shAns=false;
  // Pick quiz type: 0=given root letters, pick meaning; 1=given meaning, pick root; 2=given word, pick root
  var qtype=Math.floor(Math.random()*3);
  var correct=shorashim[Math.floor(Math.random()*shorashim.length)];
  var others=shorashim.filter(function(s){return s!==correct;}).sort(function(){return Math.random()-.5;}).slice(0,3);
  var opts=[...others,correct].sort(function(){return Math.random()-.5;});
  var html='<div class="progress-label"><span>Shoresh Quiz</span><button class="btn-ghost" style="padding:4px 12px;font-size:12px" onclick="_shMode=\'browse\';renderShorashBrowse()">Browse</button></div>';

  if(qtype===0){

    var rootLetters=correct.root.map(function(l){
      return '<div class="shoresh-letter-box revealed">'+l+'</div>';
    }).join('');
    html+='<div class="shoresh-root-letters" style="justify-content:center;margin-bottom:8px">'+rootLetters+'</div>'+
      '<div style="font-size:13px;color:var(--muted);text-align:center;margin-bottom:16px;font-style:italic">'+correct.pron+'</div>'+
      '<div class="shoresh-quiz-prompt">What does this root mean?</div>'+
      '<div class="shoresh-opts">';
    opts.forEach(function(o,i){
      html+='<button class="shoresh-opt" onclick="checkShoresh('+i+','+(o===correct)+')">'+
        '<span style="font-size:18px;font-weight:600">'+o.meaning+'</span>'+
      '</button>';
    });
  } else if(qtype===1){
    // Show meaning, pick the root letters
    html+='<div style="text-align:center;margin-bottom:6px;font-size:13px;letter-spacing:2px;color:var(--muted);text-transform:uppercase">Meaning</div>'+
      '<div style="font-size:36px;font-weight:700;color:var(--text);text-align:center;margin-bottom:20px">'+correct.meaning+'</div>'+
      '<div class="shoresh-quiz-prompt">Which root (שורש) gives this meaning?</div>'+
      '<div class="shoresh-opts">';
    opts.forEach(function(o,i){
      var rl=o.root.map(function(l){return '<span style="font-family:var(--he-font);font-size:26px;margin:0 3px">'+l+'</span>';}).join('-');
      html+='<button class="shoresh-opt" onclick="checkShoresh('+i+','+(o===correct)+')">'+
        '<span class="sopt-root" style="font-size:16px;direction:ltr;display:flex;justify-content:center;gap:4px;align-items:center">'+rl+'</span>'+
        '<span class="sopt-pron">'+o.pron+'</span>'+
      '</button>';
    });
  } else {
    // Show a word, pick which root it comes from
    var word=correct.words[Math.floor(Math.random()*correct.words.length)];
    html+='<div style="text-align:center;margin-bottom:4px;font-size:13px;letter-spacing:2px;color:var(--muted);text-transform:uppercase">Word</div>'+
      '<div class="mc-he he-text" style="text-align:center;display:block;margin-bottom:6px">'+word.he+'</div>'+
      '<div style="font-size:14px;color:var(--muted);text-align:center;margin-bottom:18px;font-style:italic">'+word.en+'</div>'+
      '<div class="shoresh-quiz-prompt">Which root (שורש) does this word come from?</div>'+
      '<div class="shoresh-opts">';
    opts.forEach(function(o,i){
      var rl=o.root.map(function(l){return '<span style="font-family:var(--he-font);font-size:28px;margin:0 2px">'+l+'</span>';}).join('-');
      html+='<button class="shoresh-opt" onclick="checkShoresh('+i+','+(o===correct)+')">'+
        '<span class="sopt-root" style="font-size:14px;direction:ltr;display:flex;justify-content:center;gap:4px;align-items:center">'+rl+'</span>'+
        '<span class="sopt-pron">'+o.pron+'</span>'+
        '<span class="sopt-meaning">'+o.meaning+'</span>'+
      '</button>';
    });
  }
  html+='</div><div class="quiz-actions" style="margin-top:16px"><span style="color:var(--muted);font-size:12px">Shoresh Quiz</span><div class="streak-badge">'+ST.score+' pts</div></div>';
  document.getElementById('quizContent').innerHTML=html;
  document.getElementById('quizContent')._shCorrect=correct;
}
function checkShoresh(i,correct){
  if(_shAns)return; _shAns=true;
  var btns=document.querySelectorAll('.shoresh-opt');
  btns.forEach(function(b){b.disabled=true;});
  btns[i].classList.add(correct?'correct':'wrong');
  if(!correct){
    btns.forEach(function(b,bi){
      var ans=([...(document.getElementById('quizContent')._shCorrect.root||[])]);
      if(b.querySelector('.sopt-pron')&&b.querySelector('.sopt-pron').textContent===document.getElementById('quizContent')._shCorrect.pron) b.classList.add('correct');
      if(b.querySelector('span[style*="font-weight:600"]')&&b.querySelector('span[style*="font-weight:600"]').textContent===document.getElementById('quizContent')._shCorrect.meaning) b.classList.add('correct');

// Shown only once the answer is in, never while the learner is retrieving.
function afterReveal(w){
  if(!w) return '';
  var bits=[];
  bits.push('<span class="rank">#'+w.rank+'</span> · L'+w.level+' · '+esc(w.cat));
  var fam=(typeof familyOf==='function')?familyOf(w.he):[];
  if(fam.length) bits.push('root <b lang="he" dir="rtl">'+esc(rootOf(w.he))+'</b> — '+
    fam.slice(0,3).map(function(x){return '<b lang="he" dir="rtl">'+esc(x.he)+'</b>';}).join(' '));
  return '<div class="fs-reveal">'+bits.join('<br>')+'</div>';
}
// Correct form BESIDE the attempt, differing letters underlined. No shake,
// no red flood: "again" is information, not punishment.
function diffMark(typed,want){
  var out='';
  for(var i=0;i<want.length;i++){
    var c=esc(want[i]);
    out+=(typed[i]===want[i])?c:'<u>'+c+'</u>';
  }
  return out;
}
function checkType(){
  if(ST.answered)return;
  var inp=document.getElementById('ti');
  var typed=stripV(inp.value.trim()), correct=stripV(ST.cur.he);
  var m=matchAnswer(inp.value,ST.cur.he);
  ST.answered=true; ST.total++;
  reviewItem(itemWord(ST.cur.he),'P', m==='wrong'?false:(m==='close'?'hard':true));
  trackW(ST.cur.he,m!=='wrong');
  if(m==='close') typed=correct;
  var ok=(typed===correct), fb=document.getElementById('tfb');
  var go=document.getElementById('kbGo'); if(go) go.disabled=true;
  if(ok){
    inp.classList.add('good');
    ST.correct++;ST.score+=20+ST.streak;ST.streak++;ST.learned.add(ST.cur.he);
    fb.innerHTML='<span style="color:var(--green)">'+
      '<svg class="i"><use href="#i-check"/></svg></span>'+
      (m==='close'?'<span style="color:var(--text3)">close enough — '+
        '<span class="was" lang="he" dir="rtl">'+dHe(ST.cur)+'</span></span>':'');
  } else {
    inp.classList.add('bad'); ST.streak=0;
    fb.innerHTML='<span class="was" lang="he" dir="rtl">'+diffMark(typed,correct)+'</span>'+
      '<span class="fs-translit" lang="he-Latn" dir="ltr">'+esc(ST.cur.pron)+'</span>';
  }
  updateStats(); setTimeout(function(){advance(ok);}, ok?1200:2600);
}

function renderMatch(){
  var pool=filteredVocab();
  var sample=[...pool].sort(function(){return Math.random()-.5;}).slice(0,5);
  var heW=[...sample].sort(function(){return Math.random()-.5;});
  var enW=[...sample].sort(function(){return Math.random()-.5;});
  ST.matchPairs=sample; ST.matchDone=[]; ST.matchSel=null;
  var html='<div class="progress-label"><span>התאם — Match Hebrew to English</span><span>'+(ST.streak>0?''+ST.streak:'')+'</span></div>'+
    '<div class="match-grid"><div class="match-col">';
  heW.forEach(function(w,i){
    html+='<div class="match-item he-side" id="he'+i+'" data-w="'+w.he+'" data-t="he" onclick="selMatch(this,\''+w.he+'\',\'he\')">'+dHe(w)+'<div class="match-pron">'+w.pron+'</div></div>';
  });
  html+='</div><div class="match-col">';
  enW.forEach(function(w,i){
    html+='<div class="match-item" id="en'+i+'" data-w="'+w.he+'" data-t="en" onclick="selMatch(this,\''+w.he+'\',\'en\')">'+w.en+'</div>';
  });
  html+='</div></div>';
  document.getElementById('quizContent').innerHTML=html;
}
function selMatch(el,word,type){
  if(el.classList.contains('matched'))return;
  if(!ST.matchSel){ST.matchSel={el,word,type};el.classList.add('selected');return;}
  var prev=ST.matchSel;
  if(prev.type===type){prev.el.classList.remove('selected');el.classList.add('selected');ST.matchSel={el,word,type};return;}
  if(prev.word===word){
    prev.el.classList.remove('selected');prev.el.classList.add('matched');el.classList.add('matched');
    ST.matchDone.push(word);ST.matchSel=null;
    ST.score+=15;ST.streak++;ST.learned.add(word);ST.total++;ST.correct++;
    trackW(word,true);updateStats();toast('Match','good');
    if(ST.matchDone.length===ST.matchPairs.length)setTimeout(function(){toast('All matched','good');setTimeout(renderMatch,800);},400);
  } else {
    prev.el.classList.remove('selected');
    el.classList.add('wrong-flash');prev.el.classList.add('wrong-flash');
    ST.matchSel=null;ST.streak=0;ST.total++;trackW(word,false);updateStats();toast('Try again','bad');
    setTimeout(function(){el.classList.remove('wrong-flash');prev.el.classList.remove('wrong-flash');},700);
  }
}

  bank.forEach(function(bw,i){
    html+='<div class="bank-word" id="bw'+i+'" onclick="pickBank(\''+bw.he.replace(/'/g,"\\'")+ '\','+i+')"><span class="bank-he">'+dHe(bw)+'</span><span class="bank-pron">'+bw.pron+'</span></div>';
  });

function pickBank(word,idx){
  if(ST.answered)return;
  var bs=document.getElementById('bs');
  if(bs) bs.value=word;
  ST.answered=true;ST.total++;
  var ok=stripV(ST.cur.he)===stripV(word);
  // Cloze with a word bank is weak production but real USE.
  reviewItem(itemWord(ST.cur.he),'U',ok);
  trackW(ST.cur.he,ok);
  var bw=document.getElementById('bw'+idx);
  if(bw) bw.classList.add('used');
  var inp=document.getElementById('bs');
  var fb=document.getElementById('sfb');
  if(ok){
    if(inp){inp.style.color='var(--green)';inp.style.borderColor='var(--green)';}
    ST.correct++;ST.score+=15+ST.streak;ST.streak++;ST.learned.add(ST.cur.he);
    if(fb) fb.innerHTML='<span style="color:var(--green)">נכון</span>';
    toast('Correct','good');
  } else {
    if(inp){inp.style.color='var(--rose)';inp.style.borderColor='var(--rose)';}
    ST.streak=0;
    if(fb) fb.innerHTML='<span style="color:var(--rose)">Answer: </span><span class="he-text" style="font-size:22px;color:var(--blue)">'+dHe(ST.cur)+'</span> <em style="color:var(--blue);font-size:12px">('+ST.cur.pron+')</em>';
    toast(''+ST.cur.en,'bad');
  }
  updateStats();setTimeout(function(){advance(ok);},1800);
}

  var html='<div class="conv-top-bar">'+
    '<div class="progress-label" style="margin:0"><span>תרגול '+(ST.convIdx+1)+'/'+conversations.length+'</span><span>'+(ST.streak>0?''+ST.streak:'')+'</span></div>'+

function bubbleHTML(ex){
  var side=(ex.speaker==='B'||ex.speaker==='You')?'side-b':'side-a';
  var pid='cp'+(++_pid);
  return '<div class="conv-bubble '+side+'">'+
    '<div class="spkr">'+ex.speaker+'</div>'+
    '<span class="heb">'+ex.he+'</span>'+
    '<span class="eng">'+ex.en+'</span>'+
    '<button class="pron-btn" style="margin-top:5px;font-size:10px" onclick="togglePron(\''+pid+'\')"><svg class="i" aria-hidden="true"><use href="#i-eye"/></svg> הגייה</button>'+
    '<div class="pron-reveal" id="'+pid+'" style="font-size:11px">'+ex.pron+'</div>'+
  '</div>';
}
function blankUI(ex,bi,conv){
  var shuffled=[...ex.opts].sort(function(){return Math.random()-.5;});
  var html='<div id="blankRow"><div style="font-size:13px;color:var(--muted);margin-bottom:10px">Your turn: <strong>'+ex.prompt+'</strong></div><div class="conv-opts">';
  shuffled.forEach(function(o,i){
    html+='<div class="conv-opt" id="co'+i+'" onclick="checkConvOpt('+i+','+o.correct+','+bi+')">'+
      '<span class="opt-he">'+o.he+'</span>'+
      '<span class="opt-pron">'+o.pron+'</span>'+
      '<span style="color:var(--muted);font-size:12px;margin-top:2px;display:block">'+o.en+'</span>'+
    '</div>';
  });
  html+='</div><div id="cbf" style="margin-top:8px"></div></div>';
  return html;
}
function checkConvOpt(i,correct,bi){
  if(ST.answered)return; ST.answered=true;
  var conv=conversations[ST.convIdx%conversations.length];
  var opts=document.querySelectorAll('.conv-opt');
  opts.forEach(function(o){o.disabled=true;});
  opts[i].classList.add(correct?'correct':'wrong');
  if(!correct) opts.forEach(function(o){
    var oh=o.querySelector('.opt-he');
    if(oh&&conv.exchanges[bi].opts.find(function(x){return x.correct&&x.he===oh.textContent.trim()})) o.classList.add('correct');
  });
  ST.total++;ST.convDone++;bumpDay();
  var co=conv.exchanges[bi].opts.find(function(o){return o.correct;});
  if(correct){ST.correct++;ST.score+=20+ST.streak;ST.streak++;ST.convRight++;toast('Perfect','good');}
  else{ST.streak=0;toast('See answer','bad');}
  updateStats();
  var cbf=document.getElementById('cbf');
  if(cbf) cbf.innerHTML=correct?
    '<div class="conv-result good">מעולה! That is exactly what a native speaker would say.</div>':
    '<div class="conv-result bad">Best answer: <span class="heb" style="font-size:16px">'+co.he+'</span><br><em style="font-size:12px">'+co.pron+'</em></div>';
  setTimeout(function(){continueConv(bi+1,conv);},1800);
}
function continueConv(from,conv){
  var thread=document.getElementById('cthread');
  var br=document.getElementById('blankRow');
  var co=conv.exchanges[from-1].opts.find(function(o){return o.correct;});
  if(thread) thread.insertAdjacentHTML('beforeend',bubbleHTML({speaker:'You',he:co.he,pron:co.pron,en:co.en}));
  if(br) br.remove();
  var nextBlank=-1;
  for(var i=from;i<conv.exchanges.length;i++){
    if(conv.exchanges[i].isBlank){nextBlank=i;break;}
    if(thread) thread.insertAdjacentHTML('beforeend',bubbleHTML(conv.exchanges[i]));
  }
  var qc=document.getElementById('quizContent');
  if(nextBlank>=0){
    ST.answered=false;
    qc.insertAdjacentHTML('beforeend',blankUI(conv.exchanges[nextBlank],nextBlank,conv));
  } else {
    var sc=ST.convRight+'/'+ST.convTotal;
    qc.insertAdjacentHTML('beforeend',
      '<div class="conv-result '+(ST.convRight===ST.convTotal?'good':'bad')+'" style="margin-top:12px">'+
        (ST.convRight===ST.convTotal?'Perfect conversation · ':'Conversation done · ')+sc+' correct'+
      '</div>'+
      '<div class="quiz-actions" style="margin-top:14px">'+
        '<button class="btn-ghost" onclick="renderConv()">↺ Repeat</button>'+
        '<button class="btn" onclick="nextConv()">Next </button>'+
      '</div>');
  }
  qc.scrollTop=9999;
}
function nextConv(){ST.convIdx=(ST.convIdx+1)%conversations.length;renderConv();}
function jumpConv(i){ST.convIdx=i%conversations.length;renderConv();}

var _alphView='browse'; var _alphOrder=[]; var _alphIdx=0; var _alphAns=false;
function renderAlphabet(){
  if(_alphView==='browse') renderAlphBrowse();
  else renderAlphQuizCard();
}
function renderAlphBrowse(){
  _alphView='browse';
  var html='<div class="progress-label"><span>האלף-בית — 22 Letters</span></div>'+
    '<div style="display:flex;gap:8px;margin-bottom:16px">'+

function toggleAlphEx(i){var el=document.getElementById('ae'+i);if(el)el.style.display=el.style.display==='none'?'block':'none';}
function startAlphQuiz(){
  _alphView='quiz';
  _alphOrder=alephBet.map(function(_,i){return i;}).sort(function(){return Math.random()-.5;});
  _alphIdx=0;_alphAns=false;renderAlphQuizCard();
}
function renderAlphQuizCard(){
  var idx=_alphOrder[_alphIdx%_alphOrder.length];
  var l=alephBet[idx];
  var others=alephBet.filter(function(_,i){return i!==idx;}).sort(function(){return Math.random()-.5;}).slice(0,3);
  var opts=[...others,l].sort(function(){return Math.random()-.5;});
  var html='<div class="progress-label"><span>🔤 Name this letter</span><span>'+(_alphIdx+1)+'/'+alephBet.length+'</span></div>'+
    '<span class="aleph-quiz-letter he-text">'+l.letter+'</span>'+
    '<div class="mc-grid">';
  opts.forEach(function(o,i){
    html+='<button class="mc-opt" id="ao'+i+'" onclick="checkAlph('+i+','+(o===l)+',' +idx+')">'+
      '<strong>'+o.name+'</strong><br><span style="font-size:12px;color:var(--muted)">'+o.sound+'</span>'+
    '</button>';
  });
  html+='</div><div class="quiz-actions" style="margin-top:16px">'+
    '<button class="btn-ghost" onclick="_alphView=\'browse\';renderAlphBrowse()">Browse</button>'+
    '<div class="streak-badge">'+ST.streak+' </div>'+
  '</div>';
  document.getElementById('quizContent').innerHTML=html;
}
function checkAlph(i,correct,idx){
  if(_alphAns)return; _alphAns=true;
  var btns=document.querySelectorAll('.mc-opt');
  btns.forEach(function(b){b.disabled=true;});
  btns[i].classList.add(correct?'correct':'wrong');
  if(!correct) btns.forEach(function(b){if(b.querySelector('strong')&&b.querySelector('strong').textContent===alephBet[idx].name)b.classList.add('correct');});
  ST.total++;
  if(correct){ST.correct++;ST.score+=10;ST.streak++;toast('' +alephBet[idx].name,'good');}
  else{ST.streak=0;toast(''+alephBet[idx].name+' · '+alephBet[idx].sound,'bad');}
  updateStats();
  document.getElementById('quizContent').insertAdjacentHTML('beforeend',
    '<div class="aleph-reveal"><span class="aleph-name" style="font-size:16px">'+alephBet[idx].name+'</span>'+
    '<span class="aleph-sound" style="font-size:14px">Sound: '+alephBet[idx].sound+'</span>'+
    '<span class="gram-pron">Pronunciation: '+alephBet[idx].pron+'</span></div>');
  setTimeout(function(){_alphIdx++;_alphAns=false;renderAlphQuizCard();},1600);
}

function startGramQuiz(){

    '<div style="font-size:12px;color:var(--muted);text-align:center;margin-bottom:16px">'+sec.title+'</div>'+
    '<div class="mc-grid">';

    html+='<button class="mc-opt" id="go'+i+'" onclick="checkGram('+i+','+(o===row)+')">'+

    '</button>';

}
function checkGram(i,correct){
  if(_gramAns)return; _gramAns=true;
  var btns=document.querySelectorAll('.mc-opt');
  btns.forEach(function(b){b.disabled=true;});
  btns[i].classList.add(correct?'correct':'wrong');
  if(!correct) btns.forEach(function(b){
    var gh=b.querySelector('.gram-he');
    if(gh&&gh.textContent.trim()===_gramQ.he) b.classList.add('correct');
  });
  ST.total++;
  if(correct){ST.correct++;ST.score+=15;ST.streak++;toast('Correct','good');}
  else{ST.streak=0;toast(''+_gramQ.he+' ('+_gramQ.pron+')','bad');}

  setTimeout(function(){startGramQuiz();},1500);
}

// ── ANALYTICS ─────────────────────────────────────────────────
function openAnalytics(){document.getElementById('analyticsOverlay').classList.add('open');renderAnalytics(ST.atab);}
function closeAnalytics(){document.getElementById('analyticsOverlay').classList.remove('open');}
function setATab(tab,el){ST.atab=tab;document.querySelectorAll('.atab').forEach(function(t){t.classList.remove('active');});el.classList.add('active');renderAnalytics(tab);}
function renderAnalytics(tab){
  var content=document.getElementById('analyticsContent');
  var missedBtn=document.getElementById('practiceMissedBtn');
  var tracked=vocab.filter(function(w){return ST.wordStats[w.he];});
  if(!tracked.length){content.innerHTML='<div class="empty-state"> No data yet. Start studying to see analytics!</div>';missedBtn.style.display='none';return;}
  var words=[];
  if(tab==='missed'){words=tracked.filter(function(w){return ST.wordStats[w.he].w>0;}).sort(function(a,b){return ST.wordStats[b.he].w-ST.wordStats[a.he].w;}).slice(0,20);missedBtn.style.display=words.length?'':'none';}
  else if(tab==='best'){words=tracked.filter(function(w){return ST.wordStats[w.he].c>0;}).sort(function(a,b){return ST.wordStats[b.he].c-ST.wordStats[a.he].c;}).slice(0,20);missedBtn.style.display='none';}
  else{words=tracked.sort(function(a,b){var sa=ST.wordStats[a.he],sb=ST.wordStats[b.he];return(sb.w+sb.c)-(sa.w+sa.c);}).slice(0,30);missedBtn.style.display=tracked.some(function(w){return ST.wordStats[w.he].w>0;})?'':'none';}
  if(!words.length){content.innerHTML='<div class="empty-state">'+(tab==='missed'?'No mistakes yet.':'No data yet.')+'</div>';return;}
  var maxV=Math.max.apply(null,words.map(function(w){var s=ST.wordStats[w.he];return tab==='missed'?s.w:tab==='best'?s.c:s.w+s.c;}));
  var html='<div style="margin-bottom:20px">';
  words.forEach(function(w){
    var s=ST.wordStats[w.he];
    var val=tab==='missed'?s.w:tab==='best'?s.c:s.w+s.c;
    var pct=maxV?Math.round(val/maxV*100):0;
    var enShort=w.en.length>16?w.en.slice(0,16)+'…':w.en;
    var isGood=tab==='best';
    html+='<div class="bar-row">'+
      '<div class="bar-lbl">'+w.he+'</div>'+
      '<div class="bar-en">'+enShort+'</div>'+
      '<div class="bar-track"><div class="'+(isGood?'bar-good':'bar-bad')+'" style="width:'+pct+'%"></div></div>'+
      '<div class="bar-cnt">'+(tab==='all'?(s.c+' / '+s.w):val)+'</div>'+
    '</div>';
  });
  var totalC=Object.values(ST.wordStats).reduce(function(a,s){return a+s.c;},0);
  var totalW=Object.values(ST.wordStats).reduce(function(a,s){return a+s.w;},0);
  var pctC=totalC+totalW?Math.round(totalC/(totalC+totalW)*100):0;
  html+='</div><div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:16px">'+
    '<div class="stat-pill"> Correct <span class="num">'+totalC+'</span></div>'+
    '<div class="stat-pill"> Wrong <span class="num">'+totalW+'</span></div>'+
    '<div class="stat-pill"><svg class="i" aria-hidden="true"><use href="#i-today"/></svg> Accuracy <span class="num">'+pctC+'%</span></div>'+
    '<div class="stat-pill"><svg class="i" aria-hidden="true"><use href="#i-map"/></svg> Learned <span class="num">'+ST.learned.size+'</span></div>'+
  '</div>';
  content.innerHTML=html;
}

// ── TEST MODE (full-screen exam) ──────────────────────────────
// Research-backed: interleaved retrieval practice (testing effect),
// recall (typing) + recognition (MC), bidirectional EN<->HE, immediate feedback.
var TST={active:false,phase:'setup',style:'mixed',length:10,cats:[],levels:[],
  queue:[],idx:0,answered:false,correct:0,wrong:0,results:[]};
var _preTestMode='multiple';

function testPool(){
  // STRICT: only words matching the chosen categories AND levels (multi-select).
  // Empty cats = all categories; empty levels = all levels. No fallback to all vocab.
  var base=(TST.cats.length===0)?vocab.slice():vocab.filter(function(v){return TST.cats.indexOf(v.cat)>-1;});
  if(TST.levels.length) base=base.filter(function(v){return TST.levels.indexOf(v.level||2)>-1;});
  return base;
}
function testAvail(){ return testPool().length; }

function openTest(){
  document.getElementById('testOverlay').classList.add('open');
  // clear the main quiz card so its element ids (e.g. pron 'p1') don't shadow the overlay's
  var qc=document.getElementById('quizContent'); if(qc) qc.innerHTML='';
  if(!TST.active) renderTestSetup();
}
function closeTest(){
  document.getElementById('testOverlay').classList.remove('open');
  TST.active=false; TST.phase='setup';
  setMode((_preTestMode&&_preTestMode!=='test')?_preTestMode:'multiple');
}
function setTestLen(n){ TST.length=n; renderTestSetup(); }
function setTestStyle(s){ TST.style=s; renderTestSetup(); }
function toggleTestCat(c){ var i=TST.cats.indexOf(c); if(i>-1)TST.cats.splice(i,1); else TST.cats.push(c); renderTestSetup(); }
function clearTestCats(){ TST.cats=[]; renderTestSetup(); }
function toggleTestLevel(n){ var i=TST.levels.indexOf(n); if(i>-1)TST.levels.splice(i,1); else TST.levels.push(n); renderTestSetup(); }
function clearTestLevels(){ TST.levels=[]; renderTestSetup(); }

function renderTestSetup(){
  TST.phase='setup'; TST.active=false;
  var avail=testAvail();
  var lens=[{n:10},{n:20},{n:30},{n:0,lbl:'All'}];
  var lenHtml=lens.map(function(l){
    var label=l.lbl?l.lbl:(''+l.n);
    var sub=l.n===0?(avail+' words'):(avail<l.n?('max '+avail):'questions');
    return '<div class="test-chip'+(TST.length===l.n?' sel':'')+'" onclick="setTestLen('+l.n+')">'+label+'<span class="tc-sub">'+sub+'</span></div>';
  }).join('');
  var styles=[
    {id:'mixed',lbl:'Mixed',sub:'all styles · best recall'},
    {id:'mc',lbl:'Multiple Choice',sub:'pick from 4'},
    {id:'type',lbl:'Fill the Blank',sub:'type the Hebrew'}
  ];
  var styleHtml=styles.map(function(s){
    return '<div class="test-chip'+(TST.style===s.id?' sel':'')+'" onclick="setTestStyle(\''+s.id+'\')">'+s.lbl+'<span class="tc-sub">'+s.sub+'</span></div>';
  }).join('');
  var chipCss='flex:0 0 auto;min-width:auto;padding:8px 14px;font-size:12px';
  var catHtml='<div class="test-chip" style="'+chipCss+(TST.cats.length===0?';border-color:var(--blue);background:var(--blue-soft);color:var(--blue)':'')+'" onclick="clearTestCats()">All</div>'+
    CATS.filter(function(c){return c!=='All';}).map(function(c){
      return '<div class="test-chip'+(TST.cats.indexOf(c)>-1?' sel':'')+'" style="'+chipCss+'" onclick="toggleTestCat(\''+c.replace(/'/g,"\\'")+'\')">'+c+'</div>';
    }).join('');
  var lvlHtml='<div class="test-chip'+(TST.levels.length===0?' sel':'')+'" onclick="clearTestLevels()">All</div>'+
    [1,2,3,4,5,6].map(function(n){
      return '<div class="test-chip'+(TST.levels.indexOf(n)>-1?' sel':'')+'" onclick="toggleTestLevel('+n+')">'+n+'</div>';
    }).join('');
  var html='<div class="test-inner">'+
    '<div class="test-head"><div class="th-logo">מבחן</div>'+
      '<button class="test-x" onclick="closeTest()">× Close</button></div>'+
    '<div class="test-setup-title">Test Yourself</div>'+
    '<div class="test-setup-sub">Science-based retrieval practice — no audio, just recall</div>'+
    '<div class="test-section"><div class="test-section-lbl">Length</div><div class="test-opt-row">'+lenHtml+'</div></div>'+
    '<div class="test-section"><div class="test-section-lbl">Question Style</div><div class="test-opt-row">'+styleHtml+'</div></div>'+
    '<div class="test-section"><div class="test-section-lbl">Categories · tap to combine</div><div class="test-opt-row" style="gap:7px">'+catHtml+'</div></div>'+
    '<div class="test-section"><div class="test-section-lbl">Levels · tap to combine</div><div class="test-opt-row">'+lvlHtml+'</div></div>'+
    '<div class="test-avail"><b>'+avail+'</b> words available with these filters</div>'+
    '<button class="test-start"'+(avail<1?' disabled':'')+' onclick="startTest()">Start Test </button>'+
  '</div>';
  document.getElementById('testOverlay').innerHTML=html;
}

function _testPickStyle(){
  if(TST.style==='mc') return Math.random()<.5?'mc_he2en':'mc_en2he';
  if(TST.style==='type') return 'type';
  var r=Math.random();
  if(r<.34) return 'mc_he2en';
  if(r<.67) return 'mc_en2he';
  return 'type';
}
function startTest(){
  var pool=testPool();
  if(!pool.length){ renderTestSetup(); return; } // no words for this category+level combo
  var n=(TST.length===0)?pool.length:Math.min(TST.length,pool.length);
  var picked=[...pool].sort(function(){return Math.random()-.5;}).slice(0,n);
  TST.queue=picked.map(function(w){return {w:w,style:_testPickStyle()};});
  TST.idx=0; TST.correct=0; TST.wrong=0; TST.results=[]; TST.answered=false; TST.active=true;
  document.getElementById('testOverlay').classList.add('open');
  var qc=document.getElementById('quizContent'); if(qc) qc.innerHTML='';
  renderTestQ();
}

function renderTestQ(){
  TST.phase='quiz'; TST.answered=false; ST.answered=false; _pid=0;
  var item=TST.queue[TST.idx], w=item.w, pool=testPool();
  var pct=Math.round(TST.idx/TST.queue.length*100);
  var head='<div class="test-head"><div class="th-logo">מבחן</div>'+
      '<button class="test-x" onclick="closeTest()">× End</button></div>'+
    '<div class="test-prog-bar"><div class="test-prog-fill" style="width:'+pct+'%"></div></div>'+
    '<div class="test-prog-meta"><span>Question '+(TST.idx+1)+' of '+TST.queue.length+'</span>'+
      '<span class="num">'+TST.correct+' right · '+TST.wrong+' wrong</span></div>';
  var body='';
  if(item.style==='mc_he2en'){
    var o1=[...pool.filter(function(x){return x!==w;}).sort(function(){return Math.random()-.5;}).slice(0,3),w].sort(function(){return Math.random()-.5;});
    body='<div class="test-prompt-big he-text">'+dHe(w)+'</div>'+pronBtn(w,'margin-bottom:20px')+'<div class="mc-grid">';
    o1.forEach(function(o){ body+='<button class="mc-opt" onclick="checkTestMC(this,'+(o===w)+')">'+o.en+'</button>'; });
    body+='</div><div class="test-feedback" id="tfb"></div>';
  } else if(item.style==='mc_en2he'){
    var o2=[...pool.filter(function(x){return x!==w;}).sort(function(){return Math.random()-.5;}).slice(0,3),w].sort(function(){return Math.random()-.5;});
    body='<div class="test-prompt-en">'+w.en+'</div><div class="mc-grid">';
    o2.forEach(function(o){ body+='<button class="mc-opt he-text" style="font-size:28px;direction:rtl;text-align:center" onclick="checkTestMC(this,'+(o===w)+')">'+dHe(o)+'</button>'; });
    body+='</div><div class="test-feedback" id="tfb"></div>';
  } else {
    body='<div class="test-style-tag">Fill the blank — type the Hebrew</div>'+
      '<div class="test-prompt-en">'+w.en+'</div>'+pronBtn(w,'margin:6px 0 16px')+
      '<div class="type-input-wrap"><input class="type-input he-text" id="ti" placeholder="כתוב כאן..." autocomplete="off" spellcheck="false" inputmode="none" onkeydown="if(event.key===\'Enter\')checkTestType()"></div>'+
      '<div class="test-feedback" id="tfb"></div>'+
      '<div class="quiz-actions" style="margin-top:12px;justify-content:flex-end"><button class="btn" onclick="checkTestType()">Check </button></div>'+
      buildKbd();
  }
  document.getElementById('testOverlay').innerHTML='<div class="test-inner">'+head+'<div class="test-q-wrap">'+body+'</div></div>';
  var ti=document.getElementById('ti'); if(ti) ti.focus();
}

function checkTestMC(btn,ok){
  if(TST.answered)return; TST.answered=true; ST.answered=true;
  var item=TST.queue[TST.idx], w=item.w;
  var btns=btn.parentNode.querySelectorAll('.mc-opt');
  btns.forEach(function(b){b.disabled=true;});
  btn.classList.add(ok?'correct':'wrong');
  if(!ok){
    btns.forEach(function(b){
      if(item.style==='mc_en2he'){ if(stripV(b.textContent.trim())===stripV(dHe(w))) b.classList.add('correct'); }
      else { if(b.textContent.trim()===w.en) b.classList.add('correct'); }
    });
  }
  var fb=document.getElementById('tfb');
  if(fb) fb.innerHTML=ok?'<span style="color:var(--green)"><svg class="i"><use href="#i-check"/></svg></span>':'<span style="color:var(--rose)">'+(item.style==='mc_en2he'?esc(w.en)+' = ':'')+'</span>'+(item.style==='mc_en2he'?'<span class="he-text" style="color:var(--blue);font-size:20px">'+dHe(w)+'</span>':'<span class="he-text" style="color:var(--blue);font-size:20px">'+dHe(w)+'</span>');
  _testRecord(ok,'');
  setTimeout(_testNext, ok?900:1600);
}

function checkTestType(){
  if(TST.answered)return; TST.answered=true; ST.answered=true;
  var w=TST.queue[TST.idx].w;
  var inp=document.getElementById('ti');
  var typed=stripV((inp?inp.value:'').trim());
  var ok=typed===stripV(w.he);
  if(inp){ inp.classList.add(ok?'good':'bad'); inp.disabled=true; }
  var fb=document.getElementById('tfb');
  if(fb){
    if(ok) fb.innerHTML='<span style="color:var(--green)">מעולה</span>';
    else fb.innerHTML='<span style="color:var(--rose)">Answer: </span><span class="he-text" style="font-size:24px;color:var(--blue)">'+dHe(w)+'</span> <em style="color:var(--blue);font-size:12px">('+w.pron+')</em>';
  }
  _testRecord(ok, typed||'(blank)');
  setTimeout(_testNext, ok?1100:2000);
}

function _testRecord(ok,your){
  var item=TST.queue[TST.idx], w=item.w;
  ST.total++; trackW(w.he,ok);
  if(ok){ TST.correct++; ST.correct++; ST.score+=10; ST.streak++; ST.learned.add(w.he); }
  else { TST.wrong++; ST.streak=0; }
  TST.results.push({w:w,ok:ok,style:item.style,your:your||''});
  updateStats();
}
function _testNext(){
  TST.idx++;
  if(TST.idx>=TST.queue.length) renderTestResults();
  else renderTestQ();
}

function renderTestResults(){

function retestMissed(){

  if(!mw.length){ renderTestSetup(); return; }
  TST.queue=mw.map(function(w){return {w:w,style:_testPickStyle()};});
  TST.idx=0; TST.correct=0; TST.wrong=0; TST.results=[]; TST.answered=false; TST.active=true;

// ══════════════════════════════════════════════════════════════
// ANSWER MATCHING — typo tolerance
// ══════════════════════════════════════════════════════════════
// Exact-match-or-wrong is brutal on a phone keyboard in a script you are
// still learning, and it punishes a motor slip as if it were a memory
// failure. A single-character slip on a longer word counts, but only as
// "hard" — it still advances, just less far.
function lev(a,b){
  if(a===b) return 0;
  var m=a.length,n=b.length,prev=[],cur=[],i,j;
  for(j=0;j<=n;j++) prev[j]=j;
  for(i=1;i<=m;i++){
    cur[0]=i;
    for(j=1;j<=n;j++){
      cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a.charAt(i-1)===b.charAt(j-1)?0:1));
    }
    prev=cur.slice();
  }
  return prev[n];
}
// A real-word index, so a one-letter slip can be told apart from a different
// word. חלון "window" and חלום "dream" differ by one letter and are BOTH real;
// accepting one for the other would teach the wrong thing.
var _vocabSet=null;
function vocabSet(){
  if(_vocabSet) return _vocabSet;
  _vocabSet={};
  vocab.forEach(function(w){ _vocabSet[stripV(w.he)]=1; });
  return _vocabSet;
}
function matchAnswer(typed,want){
  var t=stripV(typed||'').trim(), w=stripV(want||'').trim();
  if(!t) return 'wrong';
  if(t===w) return 'exact';
  // 4, not 5: Hebrew drops its vowels, so a 4-letter word is already
  // substantial. Below that a single character is too much of the word.
  if(w.length>=4 && lev(t,w)===1 && !vocabSet()[t]) return 'close';
  return 'wrong';
}

// ══════════════════════════════════════════════════════════════
// CAN-DOS — what a level is actually FOR
// ══════════════════════════════════════════════════════════════
// Words and patterns are selected because they serve these, not the other
// way round. A can-do is demonstrated when the pieces it needs are secure.
const CANDOS=[
 {id:'c1a',level:1,text:'Greet someone and say who I am',      words:['שלום','אני','שם','מה'],      patterns:[]},
 {id:'c1b',level:1,text:'Say what I want and what I do not',   words:['רוצה','לא'],                 patterns:['want_n','want_v']},
 {id:'c1c',level:1,text:'Say what I have and have not',        words:['יש','אין'],                  patterns:['have','havenot']},
 {id:'c1d',level:1,text:'Ask where something is',              words:['איפה'],                      patterns:['where']},
 {id:'c1e',level:1,text:'Say what I need',                     words:['צריך'],                      patterns:['need']},
 {id:'c2a',level:2,text:'Ask the price of something',          words:['כמה','כסף'],                 patterns:['cost']},
 {id:'c2b',level:2,text:'Ask permission to do something',      words:['אפשר'],                      patterns:['can_i']},
 {id:'c2c',level:2,text:'Ask whether a shop has something',    words:['יש'],                        patterns:['have_you']},
 {id:'c2d',level:2,text:'Say what I like doing',               words:['אוהב'],                      patterns:['like_to']},
 {id:'c2e',level:2,text:'Ask when something happens',          words:['מתי'],                       patterns:['when']},
 {id:'c2f',level:2,text:'Describe something with an adjective',words:['טוב','גדול'],                patterns:['very']},
];
function candoDone(c){
  var wOk=c.words.every(function(h){
    var w=vocab.filter(function(v){return v.he===h;})[0];
    if(!w) return true;                       // not in the app yet: do not block
    var s=wordState(h); return s==='secure'||s==='mastered';
  });
  var pOk=c.patterns.every(function(id){ return getCard(itemPattern(id),'U').n>=3; });
  return wOk&&pOk;
}

// ══════════════════════════════════════════════════════════════
// LOAD GOVERNOR — the reason people quit spaced repetition
// ══════════════════════════════════════════════════════════════
// A backlog compounds: miss a week, open the app, see 600 cards, never
// open it again. New words stop arriving while you are behind, and a
// catch-up day is capped rather than dumped on you.
const LOAD={pauseNewAt:60, catchUpCap:40};
function dueTotal(){ return dueList('R').length+dueList('P').length; }
function newPaused(){ return dueTotal()>=LOAD.pauseNewAt; }

// ══════════════════════════════════════════════════════════════
// QUESTS — name a number and a thing; never reward opening the app
// ══════════════════════════════════════════════════════════════
// Goal-setting research is consistent that specific and difficult beats
// vague. "Complete 5 lessons" trains you to open the app; "secure 3 words"
// trains you in Hebrew. Everything here counts demonstrated ability.
function isoWeek(d){
  d=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  d.setUTCDate(d.getUTCDate()+4-(d.getUTCDay()||7));
  var y=new Date(Date.UTC(d.getUTCFullYear(),0,1));
  return d.getUTCFullYear()+'-W'+Math.ceil(((d-y)/864e5+1)/7);
}
function secureCount(){
  return vocab.filter(function(w){var s=wordState(w.he);return s==='secure'||s==='mastered';}).length;
}
function patternSecureCount(){
  return PATTERNS.filter(function(p){return getCard(itemPattern(p.id),'U').n>=3;}).length;
}
const QUEST_DEFS={
  secure3  :{scope:'daily', target:3,  label:'Secure 3 words',          read:secureCount},
  clearDue :{scope:'daily', target:0,  label:'Clear every due review',  read:dueTotal, countDown:true},
  pattern1 :{scope:'daily', target:1,  label:'Secure a sentence pattern', read:patternSecureCount},
  secure15 :{scope:'weekly',target:15, label:'Secure 15 words',         read:secureCount},
  pattern3 :{scope:'weekly',target:3,  label:'Secure 3 sentence patterns', read:patternSecureCount},
  cando2   :{scope:'weekly',target:2,  label:'Unlock 2 can-dos',        read:function(){return CANDOS.filter(candoDone).length;}}
};
function refreshQuests(){
  // dayKey(), not toISOString(): UTC rolled the daily quests over mid-evening
  // west of Greenwich (the same trap the streak hit).
  var today=dayKey(), wk=isoWeek(new Date());
  ST.quests=ST.quests||{};
  if(ST.quests.day!==today){
    ST.quests.day=today;
    ST.quests.daily=['secure3','clearDue','pattern1'].map(function(k){
      return {k:k,base:QUEST_DEFS[k].read(),did:0};
    });
  }
  if(ST.quests.week!==wk){
    ST.quests.week=wk;
    ST.quests.weekly=['secure15','pattern3','cando2'].map(function(k){
      return {k:k,base:QUEST_DEFS[k].read()};
    });
  }
}
// Counts a DUE review answered today, for the clear-reviews quest.
function questReviewed(){
  var qs=ST.quests&&ST.quests.daily; if(!qs || ST.quests.day!==dayKey()) return;
  qs.forEach(function(q){ if(q.k==='clearDue') q.did=(q.did||0)+1; });
}
function questProgress(q){
  var d=QUEST_DEFS[q.k];
  // "Clear every due review" is earned, not granted: it completes only once
  // at least one due review was actually answered today and none remain.
  // With nothing due and nothing answered there is nothing to clear, so it
  // says so instead of showing a free tick.
  if(d.countDown){
    var left=d.read(), did=q.did||0;
    if(!left && !did) return {now:0, target:0, done:false, idle:true, label:d.label};
    return {now:left, target:0, done:!left && did>0, label:d.label};
  }
  var gained=Math.max(0,d.read()-q.base);
  return {now:Math.min(gained,d.target), target:d.target, done:gained>=d.target, label:d.label};
}

// ══════════════════════════════════════════════════════════════
// LEVEL CHECKPOINT — the hard gate
// ══════════════════════════════════════════════════════════════
// Production only, sampled across the level. Breadth alone can be reached
// by drilling a convenient subset; a sampled test cannot.
var CHK={active:false,level:0,queue:[],i:0,right:0,answered:false};
const CHK_LEN=20;
function checkpointReady(l){ return levelShape(l).secure>=CFG.gate.breadth*100; }
function checkpointPassed(l){ return (ST.checkpoints||{})['L'+l]===true; }
function levelCleared(l){ return checkpointPassed(l); }

function startCheckpoint(l){
  var pool=vocab.filter(function(w){return w.level===l;}).sort(function(){return Math.random()-.5;});
  CHK={active:true,level:l,queue:pool.slice(0,CHK_LEN),i:0,right:0,answered:false};
  showView('Levels'); renderCheckpoint();
}
function renderCheckpoint(){
  if(CHK.i>=CHK.queue.length) return finishCheckpoint();
  var w=CHK.queue[CHK.i]; CHK.answered=false; ST.cur=w;
  document.getElementById('levelsBody').innerHTML=
    '<div class="compact-head"><span class="ch-title">מבחן רמה '+CHK.level+'</span>'+
      '<span class="mini-pill">'+(CHK.i+1)+' / '+CHK.queue.length+'</span></div>'+
    '<div class="step-kind">type it in Hebrew — no hints</div>'+
    '<div class="type-english">'+esc(w.en)+'</div>'+
    '<div class="type-input-wrap"><input class="type-input he-text" id="ti" autocomplete="off" '+
      'autocorrect="off" autocapitalize="off" spellcheck="false" lang="he" '+
      'inputmode="none" onkeydown="if(event.key===\'Enter\')checkCheckpoint()"></div>'+
    '<div class="type-feedback" id="cfb"></div>'+
    '<div class="quiz-actions" style="margin-top:10px">'+
      '<button class="btn-ghost" onclick="abortCheckpoint()">Quit</button>'+
      '<button class="btn" onclick="checkCheckpoint()">Check </button></div>'+
    buildKbd();
  var i=document.getElementById('ti'); if(i) i.focus();
}
function checkCheckpoint(){
  if(CHK.answered) return;
  var inp=document.getElementById('ti'); if(!inp) return;
  var w=CHK.queue[CHK.i], m=matchAnswer(inp.value,w.he);
  if(m==='wrong'&&!inp.value.trim()) return;
  CHK.answered=true;
  if(m!=='wrong') CHK.right++;
  // The checkpoint is formative: a miss feeds straight back into review.
  reviewItem(itemWord(w.he),'P', m==='wrong'?false:(m==='close'?'hard':true));
  var fb=document.getElementById('cfb');
  fb.innerHTML = m==='exact' ? '<span style="color:var(--green)"><svg class="i"><use href="#i-check"/></svg></span>'
    : m==='close' ? '<span style="color:var(--teal)">almost — '+esc(w.he)+'</span>'
    : '<span style="color:var(--rose)">'+esc(w.he)+'</span>';
  CHK.i++;
  setTimeout(renderCheckpoint, m==='exact'?650:1600);
}
function abortCheckpoint(){ CHK.active=false; renderLevelsView(); }
function finishCheckpoint(){
  var pct=Math.round(100*CHK.right/CHK.queue.length);
  var pass=pct>=CFG.gate.checkpoint*100;
  CHK.active=false;
  if(pass){ ST.checkpoints=ST.checkpoints||{}; ST.checkpoints['L'+CHK.level]=true; }
  saveProgress();
  document.getElementById('levelsBody').innerHTML=
    '<div class="today-hero"><div class="th-n">'+pct+'%</div>'+
      '<div class="th-l">'+(pass?'level '+CHK.level+' cleared':'not yet')+'</div>'+
      '<div class="th-sub">'+CHK.right+' of '+CHK.queue.length+' produced correctly.<br>'+
      (pass?'Level '+(CHK.level+1)+' is open.':'You need '+Math.round(CFG.gate.checkpoint*100)+'%. The ones you missed are back in review.')+
      '</div></div>'+
    '<button class="big-btn" onclick="renderLevelsView()">Back to levels</button>';
}

// ══════════════════════════════════════════════════════════════
// SHELL — Today / Levels / Practice / Me
// ══════════════════════════════════════════════════════════════
var VIEW='Today';
// Tab changes animate where the browser supports View Transitions and the
// user has not asked for reduced motion; everywhere else they are instant.
// The DOM update runs either way — the transition is decoration, never a gate.
// Shown at the bottom of Me. Bump together with CACHE_VERSION in sw.js.
var APP_BUILD='jw-v53';
var _rm=window.matchMedia?window.matchMedia('(prefers-reduced-motion: reduce)'):null;
function goTab(v){
  if(v===VIEW || !document.startViewTransition || (_rm&&_rm.matches)) return showView(v);
  // A view transition runs its update on the next rendered frame. If no frame
  // comes (throttled or backgrounded page), the tab must still change: after
  // 150ms we switch directly and drop the animation. Whichever runs first wins.
  var done=false;
  function go(){ if(done) return; done=true; showView(v); }
  var t=document.startViewTransition(go);
  setTimeout(function(){ if(!done){ go(); try{ t.skipTransition(); }catch(e){} } },150);
  // a skipped transition rejects these; the view has still changed
  if(t&&t.ready) t.ready.catch(function(){});
  if(t&&t.finished) t.finished.catch(function(){});
  if(t&&t.updateCallbackDone) t.updateCallbackDone.catch(function(){});
}
function showView(v){
  VIEW=v;
  ['Today','Levels','Practice','Me'].forEach(function(n){
    var el=document.getElementById('view'+n); if(el) el.classList.toggle('on',n===v);
    var tb=document.getElementById('tab'+n);  if(tb) tb.classList.toggle('on',n===v);
  });
  renderHead();
  if(v==='Today')    renderToday();
  if(v==='Levels')   renderLevelsView();
  if(v==='Me')       renderMe();
  if(v==='Practice') { renderModes(); updateSelLabels(); }
  window.scrollTo(0,0);
}

// The level you are actually working on: the first one not yet cleared.
function activeLevel(){
  // A level opens the next one only when its checkpoint is passed. Breadth
  // alone can be reached by drilling a convenient subset of the level.
  for(var l=1;l<=6;l++){ if(!levelCleared(l)) return l; }
  return 6;
}
// Locked means NEW WORDS from this level are not yet introduced. Practice is
// never blocked — you can always drill anything from the Practice tab.
function levelLocked(l){
  if(l<=1) return false;
  if(levelCleared(l-1)) return false;
  return levelShape(l-1).secure < CFG.gate.softUnlock*100;
}

// ══════════════════════════════════════════════════════════════
// THE DAILY ROUND — one tap, ~12 items, mixed
// ══════════════════════════════════════════════════════════════
// Interleaved by design: mixing item types and directions within a session
// feels worse and retains better than running blocks of one mode.
var ROUND={active:false,steps:[],i:0,right:0,wrong:0,started:0};
var ROUND_LEN=12;

function dueList(dim){
  return vocab.filter(function(w){
    var c=getCard(itemWord(w.he),dim);
    return c.reps>0 && c.due<=Date.now();
  }).sort(function(a,b){
    return getCard(itemWord(a.he),dim).due-getCard(itemWord(b.he),dim).due;
  });
}
function freshList(){
  // Nothing new while a backlog is building — this is the single rule that
  // stops the review queue running away from you.
  if(newPaused()) return [];
  var lv=activeLevel();
  return vocab.filter(function(w){
    return w.level<=lv && getCard(itemWord(w.he),'R').reps===0;
  }).sort(function(a,b){ return a.rank-b.rank; });   // most frequent first
}
function roundCounts(){
  return {dueR:dueList('R').length, dueP:dueList('P').length, fresh:freshList().length};
}

function buildRound(){
  var steps=[], seen={};
  function push(kind,w,pat){
    var k=kind+':'+(w?w.he:pat.id);
    if(seen[k]) return; seen[k]=1;
    steps.push({kind:kind,w:w,p:pat});
  }
  // Reviews carry the round; new material is strictly rationed.
  dueList('P').slice(0,5).forEach(function(w){ push('type',w); });
  dueList('R').slice(0,5).forEach(function(w){ push('mc',w); });
  // Production unlocks once recognition is established. Without this the gate
  // dimension can never start: a word only gets a P card by being typed, and
  // it is only typed if it already has a due P card.
  vocab.filter(function(w){
    return getCard(itemWord(w.he),'R').n>=2 && getCard(itemWord(w.he),'P').reps===0;
  }).sort(function(a,b){ return a.rank-b.rank; })
    .slice(0,3).forEach(function(w){ push('type',w); });
  PATTERNS.filter(function(p){ return p.level<=activeLevel()+1 && patternKnownFillers(p).length; })
    .sort(function(a,b){ return getCard(itemPattern(a.id),'U').reps-getCard(itemPattern(b.id),'U').reps; })
    .slice(0,3).forEach(function(p){ push('pattern',null,p); });
  // One word-family item per round: the Connect dimension, and the only
  // thing that makes Hebrew's morphology pay off.
  var rk=rootDue();
  if(rk) steps.push({kind:'root',root:rk});
  // Top up from words already met, never by adding more new ones.
  if(steps.length<ROUND_LEN){
    vocab.filter(function(w){ return getCard(itemWord(w.he),'R').reps>0; })
      .sort(function(a,b){ return getCard(itemWord(a.he),'R').due-getCard(itemWord(b.he),'R').due; })
      .forEach(function(w){ if(steps.length<ROUND_LEN) push('mc',w); });
  }
  var rest=steps.sort(function(){ return Math.random()-.5; });

  // At most 3 genuinely new words per round. Each is introduced and then
  // tested later in the SAME round — the study card is shown once, after
  // which the word is retrieved rather than re-read.
  var intros=freshList().slice(0,3);
  var echoes=intros.map(function(w){ return {kind:'mc',w:w,echo:true}; });
  var out=intros.map(function(w){ return {kind:'intro',w:w}; });
  // Intros first guarantees every echo lands after its own introduction.
  out=out.concat(rest.concat(echoes).sort(function(){ return Math.random()-.5; }));
  return out.slice(0,ROUND_LEN);
}

function startRound(){
  ROUND={active:true,steps:buildRound(),i:0,right:0,wrong:0,started:Date.now()};
  if(!ROUND.steps.length){ ROUND.active=false; renderToday(); return; }
  showView('Today'); roundStep();
}
var STEP_LABEL={mc:'recognise',type:'produce — type it',pattern:'use it in a sentence',intro:'new word',root:'word family'};
// A quiet hairline: where you are in a short known sequence, with no
// numbers to process mid-retrieval.
function segBar(){
  var h='<div class="seg-bar">';
  for(var i=0;i<ROUND.steps.length;i++)
    h+='<div class="seg'+(i<ROUND.i?' done':i===ROUND.i?' now':'')+'"></div>';
  return h+'</div>';
}
function exitRound(){
  ROUND.active=false;
  document.body.classList.remove('focus');
  saveProgress(); renderToday(); showView('Today');
}
function roundStep(){
  if(ROUND.i>=ROUND.steps.length){ return roundDone(); }
  var st=ROUND.steps[ROUND.i];
  ST.answered=false;
  if(st.kind==='pattern'){ PAT.p=st.p; PAT.w=patternPickWord(st.p); PAT.answered=false; }
  else if(st.kind==='root'){ /* rootHTML sets ROOTQ */ }
  else ST.cur=st.w;
  document.body.classList.add('focus');
  var body=document.getElementById('todayBody');
  body.innerHTML=
    '<div class="focus-wrap">'+
      '<div class="focus-strip">'+
        '<button class="focus-exit" onclick="exitRound()" aria-label="Exit round">'+
          '<svg class="i"><use href="#i-close"/></svg></button>'+
        segBar()+
      '</div>'+

// Four slots, always R-P-U-C, read by POSITION. Hue carries nothing, so it
// survives any colour-vision deficiency and needs no legend.
function dimGlyph(sh){
  return '<span class="dimglyph">'+['R','P','U','C'].map(function(d){
    var v=sh[d];
    var c = v===null?'' : v>=70?' full' : v>=30?' half' : '';

// ── THE JOURNEY MAP ──────────────────────────────────────────
// Every word as one dot, ordered by frequency rank and read RIGHT-TO-LEFT
// to match Hebrew. State is encoded by LIGHTNESS only, so it survives every
// form of colour-vision deficiency. One canvas, one paint, repainted only
// when state changes — cheap at 1,441 items.

function dotState(w){
  var r=getCard(itemWord(w.he),'R'), pr=getCard(itemWord(w.he),'P');
  if(pr.reps>0 && wordState(w.he)==='secure') return 'secure';
  if(r.reps>0) return 'seen';
  if(r.n>0||ST.learned.has(w.he)) return 'met';
  return 'unseen';
}
function drawMap(id,onlyLevel,pitchArg,dimBeyond){
  var cv=document.getElementById(id); if(!cv) return;
  var words=vocab.slice().sort(function(a,b){return a.rank-b.rank;});
  if(onlyLevel) words=words.filter(function(w){return w.level===onlyLevel;});
  var cssW=cv.parentNode.clientWidth||343;
  var pitch=pitchArg||10;
  if(pitchArg==='fit'){
    // Choose the pitch that fills the available box without overflowing it.
    var availH=cv.parentNode.clientHeight||120, n=words.length;
    pitch=7;
    for(var t=12;t>=6;t--){
      var cl=Math.floor(cssW/t), rw=Math.ceil(n/Math.max(1,cl));
      if(rw*t<=availH){ pitch=t; break; }
    }
  }
  // 8px cells with 2px gaps: big enough to read as data, not texture.
  var dot=pitch-2, gap=10, labelH=onlyLevel?0:22;
  var cols=Math.max(12,Math.floor(cssW/pitch));
  // the leftover sub-cell width splits evenly, so both side margins match
  var off=Math.max(0,(cssW-cols*pitch)/2);
  var bands=[], cur=null;
  words.forEach(function(w){
    if(!cur||cur.lv!==w.level){ cur={lv:w.level,items:[]}; bands.push(cur); }
    cur.items.push(w);
  });
  var y=0, rowsTotal=0;
  bands.forEach(function(b){ y+=labelH; b.y=y; b.rows=Math.ceil(b.items.length/cols);
    rowsTotal+=b.rows; y+=b.rows*pitch+gap; });
  var cssH=Math.max(24,y-gap);
  var dpr=Math.min(3,window.devicePixelRatio||1);   // iPhones are 3x
  cv.width=Math.round(cssW*dpr); cv.height=Math.round(cssH*dpr);
  cv.style.height=cssH+'px';
  var x=cv.getContext('2d'); x.setTransform(dpr,0,0,dpr,0,0);
  x.clearRect(0,0,cssW,cssH);
  if(labelH){
    // Each band names itself, read from the right like the cells.
    x.font='12px "Source Serif 4", Georgia, serif'; x.fillStyle=cssv('--text3');
    x.textAlign='right'; x.textBaseline='alphabetic';
    bands.forEach(function(b){ x.fillText('Level '+b.lv+' · '+b.items.length+' words', cssW-off-(pitch-dot)/2, b.y-8); });
  }
  var C={unseen:cssv('--map-unseen'), met:cssv('--map-met'), seen:cssv('--map-seen'),
          secure:cssv('--map-secure'), due:cssv('--warning')};
  bands.forEach(function(b){
    b.items.forEach(function(w,i){
      var r=Math.floor(i/cols), c=i%cols;
      var px=cssW-off-(c+1)*pitch+(pitch-dot)/2;      // RTL
      var py=b.y+r*pitch;
      var st=dotState(w);
      var ahead=dimBeyond && w.level>dimBeyond;
      x.globalAlpha = ahead ? 0.32 : 1;
      // Unseen is a quiet FILLED cell, not a 1px outline: a field of hairline
      // squares reads as texture and shimmers when scaled.
      if(st==='unseen'){ x.fillStyle=C.unseen; x.fillRect(px,py,dot,dot); }
      else {
        x.fillStyle = st==='secure' ? C.secure
                    : st==='seen'   ? C.seen
                    : C.met;
        x.fillRect(px,py,dot,dot);
      }
      if(!ahead && (dueNow(itemWord(w.he),'R')||dueNow(itemWord(w.he),'P'))){
        x.strokeStyle=C.due; x.lineWidth=1;
        x.strokeRect(px-.5,py-.5,dot+1,dot+1);
      }
      x.globalAlpha=1;
    });
  });
  return bands;
}
function dueNow(id,dim){ var c=getCard(id,dim); return c.reps>0 && c.due<=Date.now(); }


// Say when, not just that there is nothing: a dead end with no horizon is
// what makes an empty state feel broken.
function nextDueLine(){
  var soonest=Infinity;
  Object.keys(ST.cards).forEach(function(k){
    var c=ST.cards[k]; if(c&&c.reps>0&&c.due>Date.now()&&c.due<soonest) soonest=c.due;
  });
  if(soonest===Infinity) return '';
  var h=Math.round((soonest-Date.now())/36e5);
  if(h<1) return ' — next review in under an hour';
  if(h<24) return ' — next review in '+h+'h';
  return ' — next review in '+Math.round(h/24)+'d';
}

// ── ROOT FAMILIES ─────────────────────────────────────────────
// Semitic morphology is a force multiplier: one root unlocks a family, so
// knowing כ־ת־ב makes כתב, מכתב and כתובת cohere instead of being three
// unrelated strings. This is the Connect dimension.
var _fam=null;
// Only families whose connection a learner can actually SEE. The annotation
// layer also yields etymologically-correct but useless ones — ב־ט־ח ties
// watermelon to insurance, כ־ו־ן ties "yes" to "car" — and drilling those
// teaches that roots are arbitrary, which is the opposite of the point.
// Pure gender pairs (צריך/צריכה) are inflection, not family, and are free
// guesses, so they are out too.
var ROOT_OK={"ב־ו־א":1,"ל־מ־ד":1,"ה־ל־ך":1,"ח־ז־ר":1,"ב־ו־ן":1,"שׂ־מ־ח":1,"א־ה־ב":1,"שׁ־כ־ח":1,"שׁ־ב־ע":1,"א־כ־ל":1,"ק־ר־א":1,"ק־נ־ה":1,"י־שׁ־ב":1,"נ־ס־ע":1,"ח־ד־שׁ":1,"י־ו־ם":1,"ח־נ־ה":1,"ק־ו־ה":1,"ח־פ־שׂ":1,"ע־מ־ד":1,"ג־ו־ר":1,"י־ד־ה":1,"ב־ק־שׁ":1,"שׁ־ת־ה":1,"נ־ס־ה":1,"פ־ג־שׁ":1,"ב־ר־א":1,"צ־ל־ח":1,"ט־ו־ס":1,"ח־פ־שׁ":1,"ע־מ־ק":1,"ד־א־ג":1,"א־מ־ן":1,"א־פ־שׁ־ר":1,"מ־צ־א":1,"ק־שׁ־ר":1,"ח־ג־ג":1,"ט־ע־ם":1,"ה־פ־ך":1,"ק־ד־ם":1,"שׂ־ח־ק":1,"ט־י־ל":1,"כ־ע־ס":1,"נ־ק־ה":1,"א־ט־ט":1,"ס־ד־ר":1,"פ־ת־ח":1,"ז־ו־ר":1,"ס־כ־ן":1,"א־ד־ם":1,"ח־ו־ט":1,"ת־ח־ת":1,"נ־ג־ד":1,"ב־שׁ־ל":1,"ע־ו־ג":1,"ב־ק־ר":1,"צ־ע־ר":1};
function rootFamilies(){
  // Never cache an empty map: the annotation fetch is async, so an early
  // caller would otherwise freeze {} in place and the mode would stay dead.
  if(_fam && Object.keys(_fam).length) return _fam;
  _fam={};
  vocab.forEach(function(w){
    var r=rootOf(w.he); if(!r) return;
    (_fam[r]=_fam[r]||[]).push(w);
  });
  Object.keys(_fam).forEach(function(r){
    if(_fam[r].length<2 || !ROOT_OK[r]) delete _fam[r];
  });
  return _fam;
}
function familyOf(he){
  var r=rootOf(he); if(!r) return [];
  return (rootFamilies()[r]||[]).filter(function(w){ return w.he!==he; });
}
var ROOTQ={root:null,answer:null,answered:false};
function rootDue(){
  // Only families with a word you already know: the step bridges from the
  // known word to its relative. A family of strangers teaches nothing.
  var fams=rootFamilies(), keys=Object.keys(fams).filter(function(r){ return fams[r].some(knownWord); });
  if(!keys.length) return null;
  keys.sort(function(a,b){ return getCard(itemRoot(a),'C').reps-getCard(itemRoot(b),'C').reps; });
  return keys[0];
}
function rootHTML(root){
  var fam=rootFamilies()[root]||[];
  // Anchor on a word the learner has met, so the clue bridges from the
  // known to the new rather than pairing two unknowns.
  var met=fam.filter(function(w){ return getCard(itemWord(w.he),'R').reps>0; });
  var pool=met.length?met:fam;
  var pick=pool[Math.floor(Math.random()*pool.length)];
  var known=met.indexOf(pick)>=0;
  var others=fam.filter(function(w){ return w!==pick; });
  var answer=others[Math.floor(Math.random()*others.length)];
  ROOTQ={root:root,answer:answer,answered:false};
  var distract=vocab.filter(function(w){ return rootOf(w.he)!==root && w.he.indexOf(' ')<0; })
    .sort(function(){ return Math.random()-.5; }).slice(0,3);
  var opts=distract.concat([answer]).sort(function(){ return Math.random()-.5; });
  return '<div class="fs-prompt">'+
      '<div class="fs-he sm" lang="he" dir="rtl">'+esc(root)+'</div>'+
      '<div class="fs-note">'+(known?'you already know ':'from ')+
        '<b lang="he" dir="rtl">'+esc(pick.he)+'</b> — '+esc(pick.en)+'</div>'+
      '<div class="fs-en" style="font-size:19px">Which word shares this root?</div>'+
    '</div>'+
    '<div class="fs-opts">'+opts.map(function(o,i){
      return '<button class="fs-opt" id="rqo'+i+'" onclick="checkRoot(this,'+(o===answer)+')">'+
        '<span class="oh" lang="he" dir="rtl">'+esc(o.he)+'</span>'+
        '<span class="oe" lang="en" dir="ltr">'+esc(o.en)+'</span></button>';

// ── PATTERN DRILL ─────────────────────────────────────────────
// The frame is shown with its slot empty and the English spelled out; you type
// the Hebrew filler. One answer, two items reviewed: U on the pattern and P on
// the word. This is where vocabulary becomes an utterance instead of a list.
var PAT={p:null,w:null,answered:false};
// Every mode funnels through here, so a round can take over the flow without
// each mode knowing anything about rounds.
function advance(ok){ if(ROUND.active) roundNext(ok); else if(ST.mode==='pattern') renderPattern(); else if(ST.mode==='roots') renderRoots(); else newQ(); }

// NOTHING IS TESTED BEFORE IT IS TAUGHT. A pattern asks you to TYPE the
// filler, so it may only use words you have already met; a pattern with no
// known filler waits until you know one. (Before this, a first round taught
// three words and then asked you to type לעבור, סבא and שקל.)
function knownWord(w){ return getCard(itemWord(w.he),'R').reps>0; }
function patternKnownFillers(p){ return patternFillers(p).filter(knownWord); }
function patternDue(){
  var pool=PATTERNS.filter(function(p){return patternKnownFillers(p).length>0;});
  if(!pool.length) return null;
  var due=pool.filter(function(p){return cardDue(itemPattern(p.id),'U');});
  var pick=(due.length?due:pool);
  // Least-practised first, so a pattern you keep dodging surfaces.
  pick.sort(function(a,b){
    return getCard(itemPattern(a.id),'U').reps-getCard(itemPattern(b.id),'U').reps;
  });
  return pick[0];
}
function patternPickWord(p){
  // Only words already met: the pattern is the new thing here, not the word.
  var pool=patternKnownFillers(p);
  if(!pool.length) pool=patternFillers(p);   // unreachable via patternDue/buildRound
  return pool[Math.floor(Math.random()*pool.length)];
}

  _kbSubmit=checkPattern;

function renderPattern(){
  PAT.p=patternDue();

function checkPattern(){
  if(PAT.answered) return;
  var inp=document.getElementById('ti'); if(!inp) return;
  var typed=stripV(inp.value.trim()), want=stripV(PAT.w.he);
  if(!typed) return;
  PAT.answered=true; ST.answered=true; ST.total++;
  var m=matchAnswer(inp.value,PAT.w.he), ok=(m!=='wrong');
  var g=(m==='wrong')?false:(m==='close'?'hard':true);
  // One answer, two dimensions.
  reviewItem(itemPattern(PAT.p.id),'U',g);
  reviewItem(itemWord(PAT.w.he),'P',g);
  trackW(PAT.w.he,ok);
  var full=PAT.p.t.replace('___',PAT.w.he);
  var fb=document.getElementById('pfb');
  if(ok){
    inp.classList.add('good');

      '<span class="heb" style="font-size:19px">'+esc(full)+'</span><br>'+
      '<em style="font-size:12px">'+esc(PAT.w.pron)+'</em></div>';
    toast(''+PAT.w.he,'bad');

  setTimeout(function(){advance(ok);}, ok?1200:2600);
}

// ── THE SINGLE API WRAPPER ────────────────────────────────────
// Every LLM call in this feature goes through here, so swapping to a
// serverless proxy later is a one-function edit.
function sichaErr(kind,msg){ var e=new Error(msg||kind); e.kind=kind; return e; }

async function sichaComplete(system,messages,model,maxTokens,schema){
  if(!ST.apiKey) throw sichaErr('nokey');
  var body={model:model,max_tokens:maxTokens,system:system,messages:messages};
  if(schema) body.output_config={format:{type:'json_schema',schema:schema}};
  var res;
  try{
    res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{
        'x-api-key':ST.apiKey,
        'anthropic-version':'2023-06-01',
        'content-type':'application/json',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body:JSON.stringify(body)
    });
  }catch(e){ throw sichaErr('network'); }
  if(!res.ok){
    var detail='';
    try{ var ej=await res.json(); detail=(ej&&ej.error&&ej.error.message)||''; }catch(e2){}
    if(res.status===401||res.status===403) throw sichaErr('auth',detail);
    if(res.status===429) throw sichaErr('rate',res.headers.get('retry-after')||'');
    if(res.status>=500) throw sichaErr('server',detail);
    throw sichaErr('bad',detail||('HTTP '+res.status));
  }
  var data;
  try{ data=await res.json(); }catch(e){ throw sichaErr('parse'); }
  if(data.stop_reason==='refusal') throw sichaErr('refusal');
  var txt='';
  (data.content||[]).forEach(function(b){ if(b.type==='text'&&b.text) txt+=b.text; });
  txt=txt.trim();
  if(!txt) throw sichaErr('empty');
  return sichaParseJSON(txt);
}

// output_config.format should guarantee clean JSON, but parse defensively anyway.
function sichaParseJSON(txt){
  try{ return JSON.parse(txt); }catch(e){}
  var m=txt.match(/```(?:json)?\s*([\s\S]*?)```/);
  if(m){ try{ return JSON.parse(m[1]); }catch(e){} }
  var a=txt.indexOf('{'), b=txt.lastIndexOf('}');
  if(a>-1&&b>a){ try{ return JSON.parse(txt.slice(a,b+1)); }catch(e){} }
  throw sichaErr('parse');
}

function sichaErrMsg(e){
  var k=e&&e.kind;
  if(k==='nokey')   return {he:'צריך מפתח',en:'Sicha needs an Anthropic API key. Open  Settings to add one.'};
  if(k==='auth')    return {he:'המפתח לא תקין',en:'That API key was rejected. Check it in  Settings.'};
  if(k==='rate')    return {he:'רגע אחד',en:'Rate limited.'+(e.message?' Try again in about '+e.message+' seconds.':' Wait a moment, then retry.')};
  if(k==='network') return {he:'אין חיבור',en:'Network error — check your connection, then retry the turn.'};
  if(k==='server')  return {he:'תקלה בשרת',en:'The API had a server error. Retry in a moment — your conversation is not lost.'};
  if(k==='parse')   return {he:'תשובה לא ברורה',en:'The reply came back malformed. Retry the turn.'};
  if(k==='refusal') return {he:'אי אפשר להשיב',en:'The model declined to answer that. Try rephrasing.'};
  if(k==='empty')   return {he:'אין תשובה',en:'The model returned nothing. Retry the turn.'};
  return {he:'משהו השתבש',en:'Something went wrong. Retry the turn.'};
}

// ── THE VOCABULARY SLICE ──────────────────────────────────────
// Comprehensible input sits at roughly 95% known words — below that,
// comprehension collapses and the learner guesses instead of acquiring.
// This function is what enforces that ceiling. It also quietly turns every
// conversation into an SRS review session: words due for review get pulled
// into a live communicative context, which is far stronger retrieval
// practice than a flashcard.
// NEVER pass the full 1,204-word list: it blows the token budget, and an
// unconstrained lexicon is not a constraint at all.
function buildVocabSlice(scenario){
  var now=Date.now();
  // Scenario levels are 1-3 (transactional / multi-step / opinion) but the
  // vocabulary now has 6 frequency levels, so map one onto the other.
  var CAP={1:3,2:4,3:6}[scenario.level]||6;
  function isRel(w){ return scenario.cats.indexOf(w.cat)>-1 && (w.level||6)<=CAP; }
  function rankOf(w){
    var s=ST.srs[w.he];
    if(s&&s.level>0&&s.nextAt<=now) return 0;             // SRS-due, any category
    var st=ST.wordStats[w.he];
    if(st&&st.w>st.c) return 1;                            // wrong more often than right
    if(isRel(w)) return 2;                                 // category + level relevance
    return -1;                                             // outside the union
  }
  var pool=[];
  vocab.forEach(function(w){ var r=rankOf(w); if(r>=0) pool.push({w:w,r:r}); });
  pool.sort(function(a,b){
    if(a.r!==b.r) return a.r-b.r;
    var ar=isRel(a.w)?0:1, br=isRel(b.w)?0:1;
    if(ar!==br) return ar-br;
    // Earlier-listed categories win, so a scenario's topic words outrank the
    // general-purpose Verbs/Essentials that every scenario carries at the end.
    var ai=scenario.cats.indexOf(a.w.cat), bi=scenario.cats.indexOf(b.w.cat);
    if(ai<0) ai=99; if(bi<0) bi=99;
    if(ai!==bi) return ai-bi;
    return (a.w.level||2)-(b.w.level||2);
  });
  var out=[], seen={};
  function add(p){ if(seen[p.w.he]||out.length>=60) return; seen[p.w.he]=1; out.push(p.w); }
  // Prefer present-tense forms over infinitives: you speak in "אני רוצה",
  // not "לרצות". Infinitives still fill the tail of the reserve.
  var verbs=pool.filter(function(p){return isRel(p.w)&&p.w.cat==='Verbs';})
                .sort(function(a,b){
                  return (a.w.he.charAt(0)==='ל'?1:0)-(b.w.he.charAt(0)==='ל'?1:0);
                });
  var ess  =pool.filter(function(p){return isRel(p.w)&&p.w.cat==='Essentials';});
  var topic=pool.filter(function(p){return isRel(p.w)&&p.w.cat!=='Verbs'&&p.w.cat!=='Essentials';});
  // Highest-priority review words first, but reserve room so the scenario stays
  // playable even under a large backlog — and hard-reserve slots for verbs and
  // function words, without which the learner has no way to build a sentence.
  pool.slice(0,28).forEach(add);
  verbs.slice(0,12).forEach(add);
  ess.slice(0,8).forEach(add);
  topic.forEach(add);
  pool.forEach(add);
  return out.map(function(w){ return {he:w.he,en:w.en,pron:w.pron}; });
}

// ── KNOWN-WORD SET (deterministic out-of-vocabulary check) ────
var _knownSet=null;
function knownWordSet(){
  if(_knownSet) return _knownSet;
  _knownSet={};
  function reg(he){
    var s=stripV(he); if(!s) return;
    _knownSet[s]=1;
    s.split(/[^א-ת]+/).forEach(function(t){ if(t) _knownSet[t]=1; });
  }
  vocab.forEach(function(w){ reg(w.he); });
  (ST.userVocab||[]).forEach(function(w){ reg(w.he); });
  return _knownSet;
}
function isKnownToken(tok){
  var set=knownWordSet(), t=stripV(tok);
  if(!t) return true;
  if(set[t]) return true;
  // Hebrew clitics: ו ה ב ל כ מ ש attach directly to the next word.
  var c=0;
  while(c<2 && t.length>2 && 'והבלכמש'.indexOf(t.charAt(0))>-1){ t=t.slice(1); c++; if(set[t]) return true; }
  return false;
}

// ── CONVERSATION STATE ────────────────────────────────────────
var SCH={active:false,scen:null,support:'C',turns:0,thread:[],history:[],slice:[],
         progress:[],glosses:{},busy:false,ended:false,err:null,startedAt:0,debrief:null,
         dismissed:{},added:{}};

function sichaDefaultSupport(sc){
  if(ST.sichaSupport&&ST.sichaSupport[sc.id]) return ST.sichaSupport[sc.id];
  return sc.level===1?'A':(sc.level===2?'B':'C');
}

function sichaSystem(sc,slice){
  var g=(ST.gender==='f')
    ? 'female. Address her as את, use feminine verb forms and feminine adjective agreement, every single turn.'
    : 'male. Address him as אתה, use masculine verb forms and masculine adjective agreement, every single turn.';
  var tense=(sc.level>=3)
    ? 'present and past; use the future tense only if the learner uses it first'
    : 'present tense only';
  var niq=ST.showVowels?'Write with full niqqud.':'Write without niqqud.';
  var words=slice.map(function(w){ return w.he; }).join(', ');
  var extra='';
  if(SCH.support==='A') extra+='\n- Also return "suggestions": exactly 3 short, natural Hebrew replies the learner could say next. They must be things the LEARNER would say, not you. Vary them — do not make all three the same move.';
  if(SCH.support==='B') extra+='\n- Also return "starter": a 2-4 word Hebrew sentence opener the learner could build their reply on (no full sentence, just the start).';
  return 'You are a Hebrew conversation partner inside a language learning app.\n'+
    'You are: '+sc.partnerRole+'\n'+
    'Setting: '+sc.setting+'\n'+
    'The learner is trying to: '+sc.task+'\n'+
    'You opened the conversation by saying: '+sc.opener+'\n\n'+
    'HARD RULES\n'+
    '- Reply ONLY in modern spoken Israeli Hebrew. Never English. Never transliteration.\n'+
    '- Maximum 2 sentences per turn. Usually 1.\n'+
    '- EVERY turn must end with a question or something that requires a response. Never produce a dead end. This is a back-and-forth, not a service counter.\n'+
    '- Prefer these words: '+words+'\n'+
    '- You may use at most ONE word outside that list per turn.\n'+
    '- The learner is '+g+'\n'+
    '- '+niq+'\n'+
    '- Tense ceiling: '+tense+'.\n'+
    '- Stay in character. Do NOT correct the learner\'s Hebrew. Do NOT explain grammar. Do NOT praise their Hebrew. If they make an error, respond to their MEANING and naturally use the correct form in your own reply.\n'+
    '- If the learner writes English or gets stuck, respond in SIMPLER Hebrew. Never switch to English.\n'+
    '- Push back when your character would. Do not simply agree with everything.\n'+
    '- These are the success criteria for the learner\'s task: '+sc.successCriteria.join(' | ')+'\n'+
    '  Return in "taskProgress" the exact criterion strings that have been met so far, copied verbatim.\n'+
    '- If you use any word that is not in the preferred list, add it to "glosses" with its English meaning and a romanized pronunciation (CAPS marks the stressed syllable).\n'+
    '- When the task is achieved, or at turn '+sc.maxTurns+', close the conversation naturally and end your Hebrew message with [[END]].'+extra;
}

function sichaTurnSchema(){
  var props={
    he:{type:'string'},
    en:{type:'string'},
    taskProgress:{type:'array',items:{type:'string'}},
    glosses:{type:'array',items:{type:'object',
      properties:{he:{type:'string'},en:{type:'string'},pron:{type:'string'}},
      required:['he','en','pron'],additionalProperties:false}}
  };
  var req=['he','en','taskProgress','glosses'];
  if(SCH.support==='A'){ props.suggestions={type:'array',items:{type:'string'}}; req.push('suggestions'); }
  if(SCH.support==='B'){ props.starter={type:'string'}; req.push('starter'); }
  return {type:'object',properties:props,required:req,additionalProperties:false};
}
